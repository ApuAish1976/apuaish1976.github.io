<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal - Cortex Escrow</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; text-align: center; }
       .card { border: 1px solid #ddd; border-radius: 12px; padding: 20px; margin-top: 20px; }
        button { width: 100%; padding: 15px; font-size: 18px; background: #8A2BE2; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        button:disabled { background: #ccc; }
       .status { padding: 10px; border-radius: 8px; margin: 15px 0; font-weight: bold; }
       .waiting { background: #FFF3CD; color: #856404; }
       .paid { background: #D4EDDA; color: #155724; }
       .lang-switch { text-align: right; margin-bottom: 15px; }
        select { padding: 8px; }
    </style>
</head>
<body>
    <div class="lang-switch">
        <select id="language" onchange="setLanguage(this.value)">
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="hi">हिन्दी</option>
            <option value="zh">中文</option>
        </select>
    </div>

    <h2>Cortex Escrow</h2>
    <div id="loading" data-i18n="loading">جاري تحميل الصفقة...</div>

    <div id="deal-card" class="card" style="display:none;">
        <h3 id="deal-title"></h3>
        <h1><span id="deal-amount"></span> Pi</h1>
        <div id="deal-status" class="status"></div>
        <button id="pay-btn" onclick="payNow()" data-i18n="pay_btn">ادفع الآن بأمان</button>
        <p style="font-size: 12px; color: #666;" data-i18n="escrow_note">سيتم حجز المبلغ حتى تأكيد استلامك للسلعة</p>
    </div>

    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script>
        const BACKEND_URL = "https://cortex-escrow-backend.onrender.com"; // حط رابط Render حقك
        const translations = {
            ar: {
                loading: "جاري تحميل الصفقة...",
                pay_btn: "ادفع الآن بأمان",
                escrow_note: "سيتم حجز المبلغ حتى تأكيد استلامك للسلعة",
                status_waiting: "بانتظار الدفع",
                status_paid: "تم الدفع. بانتظار البائع",
                alert_login: "سجل دخول بـ Pi Browser أول",
                alert_success: "تم الدفع بنجاح. تم حجز المبلغ",
                alert_error: "فشل الدفع",
                alert_paid_already: "هذه الصفقة مدفوعة بالفعل"
            },
            en: {
                loading: "Loading deal...",
                pay_btn: "Pay Securely Now",
                escrow_note: "Amount will be held until you confirm receipt",
                status_waiting: "Waiting for payment",
                status_paid: "Paid. Waiting for seller",
                alert_login: "Please login with Pi Browser first",
                alert_success: "Payment successful. Amount is held in escrow",
                alert_error: "Payment failed",
                alert_paid_already: "This deal is already paid"
            },
            es: {
                loading: "Cargando acuerdo...",
                pay_btn: "Pagar Ahora de Forma Segura",
                escrow_note: "El monto se retendrá hasta que confirmes la recepción",
                status_waiting: "Esperando pago",
                status_paid: "Pagado. Esperando al vendedor",
                alert_login: "Inicia sesión con Pi Browser primero",
                alert_success: "Pago exitoso. Monto en garantía",
                alert_error: "Pago fallido",
                alert_paid_already: "Este acuerdo ya está pagado"
            }
        };

        let currentUser = null;
        let currentDeal = null;
        let currentLang = 'en';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar'? 'rtl' : 'ltr';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = translations[key] || translations['en'][key];
            });
            if (currentDeal) updateDealUI();
        }

        // نشغل اللغة
        const userLang = localStorage.getItem('lang') || (navigator.language || navigator.userLanguage).split('-')[0];
        currentLang = translations[userLang]? userLang : 'en';
        document.getElementById('language').value = currentLang;
        setLanguage(currentLang);

        Pi.init({ version: "2.0" });

        // 1. نجيب ID الصفقة من الرابط
        const dealId = window.location.pathname.split('/').pop() || window.location.hash.substring(1);

        // 2. نسجل دخول المشتري + نجيب بيانات الصفقة
        Pi.authenticate(['username', 'payments'], () => {}).then(auth => {
            currentUser = auth.user;
            fetchDeal();
        }).catch(err => {
            alert(translations[currentLang].alert_login);
        });

        async function fetchDeal() {
            try {
                const res = await fetch(`${BACKEND_URL}/deal/${dealId}`);
                currentDeal = await res.json();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('deal-card').style.display = 'block';
                updateDealUI();
            } catch (e) {
                document.getElementById('loading').innerText = 'Deal not found';
            }
        }

        function updateDealUI() {
            document.getElementById('deal-title').innerText = currentDeal.title;
            document.getElementById('deal-amount').innerText = currentDeal.amount;

            const statusEl = document.getElementById('deal-status');
            const payBtn = document.getElementById('pay-btn');

            if (currentDeal.status === 'waiting_payment') {
                statusEl.innerText = translations[currentLang].status_waiting;
                statusEl.className = 'status waiting';
                payBtn.disabled = false;
            } else {
                statusEl.innerText = translations[currentLang].status_paid;
                statusEl.className = 'status paid';
                payBtn.disabled = true;
            }
        }

        function payNow() {
            if (!currentUser) return alert(translations[currentLang].alert_login);
            if (currentDeal.status!== 'waiting_payment') return alert(translations[currentLang].alert_paid_already);

            const paymentData = {
                amount: currentDeal.amount,
                memo: `Escrow for: ${currentDeal.title}`,
                metadata: { dealId: currentDeal.id }
            };

            Pi.createPayment(paymentData, {
                onReadyForServerApproval: (paymentId) => {
                    fetch(`${BACKEND_URL}/approve`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId, dealId: currentDeal.id })
                    });
                },
                onReadyForServerCompletion: (paymentId, txid) => {
                    fetch(`${BACKEND_URL}/complete`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId, txid, dealId: currentDeal.id })
                    }).then(() => {
                        alert(translations[currentLang].alert_success);
                        currentDeal.status = 'paid';
                        updateDealUI();
                    });
                },
                onCancel: () => {},
                onError: (error) => alert(translations[currentLang].alert_error)
            });
        }
    </script>
</body>
</html>
