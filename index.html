<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://sdk.minepi.com; connect-src 'self' https://pi-backend-kv9g.onrender.com https://api.minepi.com https://*.minepi.com; img-src 'self' data: https://*.minepi.com; style-src 'self' 'unsafe-inline'; frame-src 'self' https://*.minepi.com https://app-cdn.minepi.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
  <title>Cortex Escrow · Pi Testnet</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --bg2: #10101a;
      --card: rgba(20, 20, 30, .94);
      --card2: rgba(28, 28, 42, .94);
      --accent: #7c6cff;
      --accent2: #22d3ee;
      --success: #00d084;
      --error: #ff4757;
      --warn: #ffa502;
      --text: #f1f2f6;
      --muted: #a4adba;
      --border: rgba(255,255,255,.12);
      --shadow: 0 18px 55px rgba(0,0,0,.35);
      --radius: 18px;
      --input-bg: rgba(255,255,255,.065);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(124,108,255,.22), transparent 34%),
        radial-gradient(circle at bottom left, rgba(34,211,238,.14), transparent 31%),
        linear-gradient(145deg, var(--bg), var(--bg2));
      color: var(--text);
      padding: 14px 14px calc(28px + var(--safe-bottom));
      line-height: 1.7;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 14px;
      background: var(--input-bg);
      color: var(--text);
      padding: 12px 13px;
      transition: .18s border-color, .18s box-shadow, .18s background;
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
      touch-action: auto;
      pointer-events: auto;
      caret-color: var(--accent2);
      min-height: 48px;
    }
    input::placeholder, textarea::placeholder { color: rgba(241,242,246,.48); }
    select option { background: #11111a; color: var(--text); }
    textarea { min-height: 128px; resize: vertical; }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(34,211,238,.58);
      box-shadow: 0 0 0 4px rgba(34,211,238,.10);
      background: rgba(255,255,255,.09);
    }
    .app { width: min(980px, 100%); margin: 0 auto; display: grid; gap: 16px; }
    .hero {
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 8px);
      background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.035));
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: -120px auto auto -120px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(255,255,255,.15), transparent 62%);
      pointer-events: none;
    }
    .hero-inner { padding: 22px; display: grid; gap: 16px; position: relative; z-index: 1; }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), #4a3cff);
      box-shadow: 0 12px 35px rgba(124,108,255,.28);
      font-weight: 900;
      color: white;
    }
    h1 { font-size: clamp(1.55rem, 5vw, 2.55rem); line-height: 1.25; }
    h2 { font-size: 1.15rem; margin-bottom: 4px; }
    .subtitle, .muted { color: var(--muted); font-size: .91rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      border-radius: 999px;
      color: var(--text);
      font-size: .84rem;
      white-space: nowrap;
    }
    .badge.ok { border-color: rgba(0,208,132,.35); color: #a9ffd9; }
    .badge.warn { border-color: rgba(255,165,2,.45); color: #ffe0a6; }
    .badge.err { border-color: rgba(255,71,87,.45); color: #ffc0c6; }
    .grid { display: grid; grid-template-columns: 1.08fr .92fr; gap: 16px; }
    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 10px 35px rgba(0,0,0,.20);
      overflow: hidden;
    }
    .card-header {
      padding: 16px 16px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card-body { padding: 16px; display: grid; gap: 13px; }
    .field { display: grid; gap: 7px; }
    .label-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    label { color: #fff; font-weight: 750; font-size: .94rem; }
    .hint { color: var(--muted); font-size: .81rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .amount-wrap { display: grid; grid-template-columns: 1fr 76px; gap: 10px; align-items: center; }
    .currency-box {
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.08);
      font-weight: 900;
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .btn {
      border: 0;
      border-radius: 14px;
      padding: 12px 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #5144ff);
      font-weight: 850;
      cursor: pointer;
      min-height: 48px;
      box-shadow: 0 12px 28px rgba(124,108,255,.22);
      transition: .18s transform, .18s opacity, .18s filter;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.secondary { background: rgba(255,255,255,.08); border: 1px solid var(--border); box-shadow: none; }
    .btn.success { background: linear-gradient(135deg, var(--success), #00a86b); box-shadow: 0 12px 28px rgba(0,208,132,.17); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; filter: grayscale(.4); }
    .status-line {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 13px;
      background: rgba(255,255,255,.055);
      color: var(--text);
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .status-line strong { font-size: .9rem; }
    .status-line span { color: var(--muted); direction: ltr; unicode-bidi: plaintext; overflow-wrap: anywhere; text-align: left; }
    .message {
      min-height: 48px;
      border-radius: 14px;
      padding: 12px 13px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.055);
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .message.ok { border-color: rgba(0,208,132,.36); color: #a9ffd9; }
    .message.err { border-color: rgba(255,71,87,.46); color: #ffc0c6; }
    .message.warn { border-color: rgba(255,165,2,.46); color: #ffe0a6; }
    footer { color: var(--muted); text-align: center; font-size: .84rem; padding: 6px; }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
      .hero-inner { padding: 18px; }
      .btn { width: 100%; }
      .actions { width: 100%; }
    }
  </style>
</head>
<body>
  <noscript>JavaScript غير مفعل. يجب تفعيل JavaScript حتى يعمل تطبيق Cortex Escrow.</noscript>
  <main class="app">
    <section class="hero">
      <div class="hero-inner">
        <div class="brand-row">
          <div class="brand">
            <div class="logo">Pi</div>
            <div>
              <h1>Cortex Escrow</h1>
              <p class="subtitle">Pi Testnet Escrow</p>
            </div>
          </div>
          <div class="badges">
            <span class="badge warn">TESTNET</span>
            <span class="badge">Currency: Pi</span>
            <span class="badge" id="backendBadge">Backend</span>
          </div>
        </div>
      </div>
    </section>

    <section class="grid">
      <section class="card">
        <div class="card-header">
          <div>
            <h2>إنشاء صفقة ضمان</h2>
          </div>
        </div>
        <form class="card-body" id="dealForm" autocomplete="off">
          <div class="field">
            <div class="label-row">
              <label for="description">وصف الصفقة</label>
            </div>
            <textarea id="description" required maxlength="900"></textarea>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="terms">شروط الصفقة</label>
              <span class="hint">اختياري</span>
            </div>
            <textarea id="terms" maxlength="700"></textarea>
          </div>

          <div class="row">
            <div class="field">
              <label for="dealType">نوع الصفقة</label>
              <select id="dealType" required>
                <option value="service">خدمة</option>
                <option value="digital">منتج رقمي</option>
                <option value="physical">منتج مادي</option>
                <option value="other">أخرى</option>
              </select>
            </div>
            <div class="field">
              <label for="amount">السعر</label>
              <div class="amount-wrap">
                <input id="amount" type="number" min="0.0000001" max="100000" step="0.0000001" inputmode="decimal" required />
                <div class="currency-box">Pi</div>
              </div>
            </div>
          </div>

          <div class="actions">
            <button class="btn" type="submit" id="createBtn">إنشاء الصفقة</button>
            <button class="btn success" type="button" id="payBtn" disabled>دفع Pi Testnet</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="card-header">
          <div>
            <h2>حالة الصفقة والدفع</h2>
          </div>
          <button class="btn secondary" type="button" id="readBtn" disabled>قراءة الصفقة</button>
        </div>
        <div class="card-body">
          <div class="status-line"><strong>Pi SDK</strong><span id="piSdkStatus"></span></div>
          <div class="status-line"><strong>Pi Account</strong><span id="piAccount"></span></div>
          <div class="status-line"><strong>Deal ID</strong><span id="dealId"></span></div>
          <div class="status-line"><strong>Payment ID</strong><span id="paymentId"></span></div>
          <div class="status-line"><strong>TXID</strong><span id="txid"></span></div>
          <div class="status-line"><strong>Status</strong><span id="dealStatus"></span></div>
          <div class="message" id="message"></div>
        </div>
      </section>
    </section>

    <footer>
      <a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a> · Cortex Escrow · Pi Testnet
    </footer>
  </main>

  <script>
    const BACKEND_URL = 'https://pi-backend-kv9g.onrender.com';
    const PI_DECIMAL_PATTERN = /^\d+(\.\d{1,7})?$/;

    const state = {
      piUser: null,
      deal: null,
      paymentId: '',
      txid: ''
    };

    const ui = {
      backendBadge: document.getElementById('backendBadge'),
      dealForm: document.getElementById('dealForm'),
      description: document.getElementById('description'),
      terms: document.getElementById('terms'),
      dealType: document.getElementById('dealType'),
      amount: document.getElementById('amount'),
      createBtn: document.getElementById('createBtn'),
      payBtn: document.getElementById('payBtn'),
      readBtn: document.getElementById('readBtn'),
      piSdkStatus: document.getElementById('piSdkStatus'),
      piAccount: document.getElementById('piAccount'),
      dealId: document.getElementById('dealId'),
      paymentId: document.getElementById('paymentId'),
      txid: document.getElementById('txid'),
      dealStatus: document.getElementById('dealStatus'),
      message: document.getElementById('message')
    };

    function setMessage(text, type = '') {
      ui.message.textContent = text || '';
      ui.message.className = type ? `message ${type}` : 'message';
    }

    function setBadge(element, text, type = '') {
      element.textContent = text || '';
      element.className = type ? `badge ${type}` : 'badge';
    }

    function updateView() {
      const deal = state.deal;
      ui.piSdkStatus.textContent = window.Pi ? 'جاهز' : '';
      ui.piAccount.textContent = state.piUser ? 'تم الاتصال' : '';
      ui.dealId.textContent = deal ? deal.dealId || deal.contractId || '' : '';
      ui.paymentId.textContent = state.paymentId || deal?.paymentId || '';
      ui.txid.textContent = state.txid || deal?.txid || '';
      ui.dealStatus.textContent = deal ? deal.status || '' : '';
      ui.readBtn.disabled = !deal;
      ui.payBtn.disabled = !deal;
    }

    function getSellerFromPi() {
      const username = state.piUser && typeof state.piUser.username === 'string' ? state.piUser.username.trim() : '';
      if (!username) {
        throw new Error('حساب Pi غير متصل');
      }
      return username;
    }

    function getAmountText() {
      const value = ui.amount.value.trim();
      if (!PI_DECIMAL_PATTERN.test(value)) {
        throw new Error('السعر يجب أن يكون Pi وبحد أقصى 7 أرقام عشرية');
      }
      const number = Number(value);
      if (!Number.isFinite(number) || number < 0.0000001 || number > 100000) {
        throw new Error('السعر يجب أن يكون بين 0.0000001 و 100000 Pi');
      }
      return value;
    }

    function getFullDescription() {
      const description = ui.description.value.trim();
      const terms = ui.terms.value.trim();
      if (!description) {
        throw new Error('وصف الصفقة مطلوب');
      }
      return terms ? `${description}\n\nالشروط:\n${terms}` : description;
    }

    async function requestJson(path, options = {}) {
      const response = await fetch(`${BACKEND_URL}${path}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.success === false) {
        throw new Error(data.message || `HTTP ${response.status}`);
      }
      return data;
    }

    async function checkBackend() {
      try {
        await requestJson('/api/health');
        setBadge(ui.backendBadge, 'Backend OK', 'ok');
      } catch (error) {
        setBadge(ui.backendBadge, 'Backend Error', 'err');
        setMessage(error.message, 'err');
      }
    }

    async function createDeal(event) {
      event.preventDefault();
      ui.createBtn.disabled = true;
      setMessage('');
      try {
        const payload = {
          description: getFullDescription(),
          seller: getSellerFromPi(),
          dealType: ui.dealType.value,
          amount: getAmountText()
        };
        const result = await requestJson('/api/escrow/create', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        state.deal = {
          dealId: result.dealId || result.contractId,
          contractId: result.contractId || result.dealId,
          amount: result.amount,
          currency: result.currency,
          network: result.network,
          status: result.status,
          paymentId: result.paymentId || '',
          txid: result.txid || ''
        };
        setMessage(result.message || 'تم إنشاء الصفقة', 'ok');
        updateView();
      } catch (error) {
        setMessage(error.message, 'err');
        updateView();
      } finally {
        ui.createBtn.disabled = false;
      }
    }

    async function readDeal() {
      if (!state.deal) return;
      setMessage('');
      try {
        const dealId = state.deal.dealId || state.deal.contractId;
        const result = await requestJson(`/api/escrow/${encodeURIComponent(dealId)}`);
        state.deal = result.deal || state.deal;
        setMessage('تم تحديث بيانات الصفقة', 'ok');
        updateView();
      } catch (error) {
        setMessage(error.message, 'err');
        updateView();
      }
    }

    async function approvePayment(paymentId, dealId) {
      const result = await requestJson('/api/pi/approve', {
        method: 'POST',
        body: JSON.stringify({ paymentId, dealId })
      });
      return result;
    }

    async function completePayment(paymentId, txid, dealId) {
      const result = await requestJson('/api/pi/complete', {
        method: 'POST',
        body: JSON.stringify({ paymentId, txid, dealId })
      });
      return result;
    }

    async function cancelPayment(paymentId) {
      if (!paymentId) return;
      await requestJson('/api/pi/cancel', {
        method: 'POST',
        body: JSON.stringify({ paymentId })
      });
    }

    function getPaymentId(payment) {
      return payment?.identifier || payment?.paymentId || payment?.id || '';
    }

    function getPaymentTxid(payment) {
      return payment?.transaction?.txid || payment?.txid || '';
    }

    function getPaymentDealId(payment) {
      return payment?.metadata?.dealId || state.deal?.dealId || state.deal?.contractId || '';
    }

    async function onIncompletePaymentFound(payment) {
      const paymentId = getPaymentId(payment);
      const txid = getPaymentTxid(payment);
      const dealId = getPaymentDealId(payment);
      if (!paymentId) return;
      state.paymentId = paymentId;
      state.txid = txid;
      updateView();
      try {
        if (txid) {
          await completePayment(paymentId, txid, dealId);
          if (dealId) {
            state.deal = { ...(state.deal || {}), dealId, paymentId, txid, status: 'COMPLETED' };
          }
          setMessage('تم إكمال دفعة سابقة', 'ok');
        }
      } catch (error) {
        setMessage(error.message, 'warn');
      }
      updateView();
    }

    function initPi() {
      if (!window.Pi) {
        ui.piSdkStatus.textContent = '';
        setMessage('Pi SDK غير متاح داخل هذه الصفحة', 'warn');
        updateView();
        return;
      }
      try {
        Pi.init({ version: '2.0', sandbox: true });
      } catch (error) {
        setMessage(error.message, 'warn');
      }
      Pi.authenticate(['username', 'payments'], onIncompletePaymentFound)
        .then((auth) => {
          state.piUser = auth && auth.user ? auth.user : auth;
          setMessage('تم الاتصال', 'ok');
          updateView();
        })
        .catch((error) => {
          setMessage(error && error.message ? error.message : 'تعذر الاتصال بحساب Pi', 'warn');
          updateView();
        });
      updateView();
    }

    function startPiPayment() {
      if (!state.deal) {
        setMessage('أنشئ الصفقة أولاً', 'warn');
        return;
      }
      if (!window.Pi || typeof Pi.createPayment !== 'function') {
        setMessage('Pi Wallet غير متاح', 'err');
        return;
      }
      const dealId = state.deal.dealId || state.deal.contractId;
      const amount = Number(state.deal.amount || ui.amount.value);
      if (!dealId || !Number.isFinite(amount) || amount <= 0) {
        setMessage('بيانات الصفقة غير مكتملة', 'err');
        return;
      }
      ui.payBtn.disabled = true;
      setMessage('');
      Pi.createPayment({
        amount,
        memo: `Cortex Escrow ${dealId}`,
        metadata: { dealId }
      }, {
        onReadyForServerApproval: async function(paymentId) {
          state.paymentId = paymentId;
          updateView();
          await approvePayment(paymentId, dealId);
        },
        onReadyForServerCompletion: async function(paymentId, txid) {
          state.paymentId = paymentId;
          state.txid = txid;
          updateView();
          await completePayment(paymentId, txid, dealId);
          state.deal = { ...state.deal, paymentId, txid, status: 'COMPLETED' };
          setMessage('تم الدفع بنجاح', 'ok');
          updateView();
          await readDeal();
        },
        onCancel: async function(paymentId) {
          state.paymentId = paymentId || state.paymentId;
          updateView();
          try {
            await cancelPayment(paymentId);
          } catch (error) {
            setMessage(error.message, 'warn');
          }
          setMessage('تم إلغاء الدفع', 'warn');
          updateView();
        },
        onError: function(error, payment) {
          state.paymentId = getPaymentId(payment) || state.paymentId;
          state.txid = getPaymentTxid(payment) || state.txid;
          setMessage(error && error.message ? error.message : 'تعذر تنفيذ الدفع', 'err');
          updateView();
        }
      }).catch((error) => {
        setMessage(error && error.message ? error.message : 'تعذر فتح Pi Wallet', 'err');
        updateView();
      }).finally(() => {
        updateView();
      });
    }

    ui.dealForm.addEventListener('submit', createDeal);
    ui.payBtn.addEventListener('click', startPiPayment);
    ui.readBtn.addEventListener('click', readDeal);

    checkBackend();
    initPi();
    updateView();
  </script>
</body>
</html>
