  <style>
    :root {
      --bg: #0a0a0f;
      --bg2: #10101a;
      --card: rgba(20, 20, 30, .92);
      --card2: rgba(28, 28, 42, .92);
      --accent: #7c6cff;
      --accent2: #22d3ee;
      --success: #00d084;
      --error: #ff4757;
      --warn: #ffa502;
      --text: #f1f2f6;
      --muted: #a4adba;
      --border: rgba(255,255,255,.12);
      --shadow: 0 18px 55px rgba(0,0,0,.35);
      --radius: 18px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(124,108,255,.22), transparent 34%),
        radial-gradient(circle at bottom left, rgba(34,211,238,.14), transparent 31%),
        linear-gradient(145deg, var(--bg), var(--bg2));
      color: var(--text);
      padding: 16px 16px calc(18px + var(--safe-bottom));
      line-height: 1.7;
    }

    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(980px, 100%);
      margin: 0 auto;
    }

    .hero {

      border-radius: calc(var(--radius) + 8px);
      background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.035));
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: -120px auto auto -120px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(255,255,255,.15), transparent 62%);
      pointer-events: none;
    }

    .hero-inner {
      padding: 24px;
      display: grid;
      gap: 18px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {

      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), #4a3cff);
      box-shadow: 0 12px 35px rgba(124,108,255,.28);
      font-weight: 900;
      letter-spacing: .5px;
    }

    h1 { font-size: clamp(1.55rem, 5vw, 2.55rem); line-height: 1.25; }
    .subtitle { color: var(--muted); font-size: .98rem; }

      background: rgba(255,255,255,.06);
      border-radius: 999px;
      color: var(--text);
      font-size: .86rem;
      white-space: nowrap;

    .grid {

      gap: 16px;
      margin-top: 16px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 10px 35px rgba(0,0,0,.20);
      overflow: hidden;
    }

    .card-header {
      padding: 16px 16px 0;

      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title { font-size: 1.05rem; font-weight: 800; }
    .card-body { padding: 16px; display: grid; gap: 12px; }

    .field { display: grid; gap: 6px; }
    .label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    label { color: #dfe4ef; font-weight: 700; font-size: .92rem; }
    .hint { color: var(--muted); font-size: .78rem; }

    input, textarea, select {
      width: 100%;
      color: var(--text);
      background: rgba(255,255,255,.07);
      border: 1px solid var(--border);
      border-radius: 14px;

      outline: none;

    .amount-wrap {

      gap: 8px;
      align-items: center;

    .currency-fixed {
      height: 48px;

      place-items: center;
      border-radius: 14px;
      border: 1px solid rgba(124,108,255,.45);
      background: rgba(124,108,255,.12);
      color: #dfdcff;
      font-weight: 900;
      user-select: none;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      border: 0;
      border-radius: 15px;
      padding: 13px 14px;
      color: white;
      cursor: pointer;
      font-weight: 900;
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .15s ease, opacity .15s ease, filter .15s ease;
    }

    .btn-danger { background: linear-gradient(135deg, var(--error), #c91f36); }

      padding: 13px;

      padding-bottom: 7px;
      font-size: .9rem;
    }
