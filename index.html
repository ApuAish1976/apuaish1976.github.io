<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Escrow V12.2</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root{--bg:#0a0a0f;--card:#14141c;--accent:#6c5ce7;--success:#00d084;--error:#ff4757;--warn:#ffa502;--text:#f1f2f6;--muted:#747d8c;--border:#2f3542}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:16px}
       .container{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;position:relative}
       .lang-select{position:absolute;top:16px;left:16px;background:#1e1e28;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px;z-index:10}
        h2{text-align:center;margin:8px 0 4px;font-weight:700}
       .subtitle{text-align:center;color:var(--muted);margin-bottom:24px;font-size:14px}
       .btn{background:linear-gradient(135deg,var(--accent),#8b7cf6);color:#fff;border:none;padding:14px 20px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;width:100%;margin:10px 0}
       .btn:disabled{opacity:.5;cursor:not-allowed}
        input,select,textarea{width:100%;padding:12px 14px;margin:8px 0;border-radius:8px;border:1px solid var(--border);background:#1e1e28;color:var(--text);font-size:15px}
        input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
        label{font-size:13px;color:var(--muted);display:block;margin:16px 0 4px}
       .status{padding:14px;border-radius:8px;margin:16px 0;font-size:14px;border-left:4px solid}
       .status.ok{background:rgba(0,208,132,.1);border-color:var(--success);color:var(--success)}
       .status.err{background:rgba(255,71,87,.1);border-color:var(--error);color:var(--error)}
       .status.warn{background:rgba(255,165,2,.1);border-color:var(--warn);color:var(--warn)}
       .status.info{background:rgba(108,92,231,.1);border-color:var(--accent);color:var(--accent)}
       .user-card{background:#1e1e28;padding:16px;border-radius:10px;margin:16px 0;border:1px solid var(--border)}
       .fee-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
       .fee-item{background:#1e1e28;padding:12px;border-radius:8px;font-size:13px}
       .fee-item strong{display:block;color:var(--accent);font-size:16px;margin-top:4px}
       .link-box{word-break:break-all;background:#0f0f17;padding:12px;border-radius:8px;font-size:13px;margin:12px 0;font-family:monospace}
       .terms-box{background:#1e1e28;padding:16px;border-radius:8px;margin:12px 0;border:1px dashed var(--border)}
       .blocked-screen{text-align:center;padding:60px 20px}
        [dir="rtl"]{text-align:right}
        [dir="ltr"]{text-align:left}
    </style>
</head>
<body>
    <select class="lang-select" id="langSelect"></select>
    <div id="app"></div>

<script type="module">
const CONFIG = {
    GENESIS_API: 'https://pi-backend-kv9g.onrender.com',
    ESCROW_ADDRESS: "GANJOECQGTUJQRYDCNSV5NODXXEDJ273RPWA3ZVPOQQ252ZLXRY4LLM3",
    APP_ID: "24f0d30e-9254-4936-9425-751c825c4aea",
    VERSION: "12.2.0",
    NETWORK: "testnet"
};

const I18N = {
    ar:{title:"Cortex Escrow V12.2",subtitle:"بروتوكول الضمان اللامركزي",login:"تسجيل الدخول عبر Pi Protocol",dealType:"نوع الصفقة",details:"تفاصيل الصفقة",terms:"شروط الصفقة",delivery:"مدة التسليم بالأيام",price:"السعر بـ Pi",sellerWallet:"محفظة البائع - Testnet",create:"إنشاء عقد ذكي موقّع",deposit:"إيداع في الضمان",release:"تحرير الدفع",newDeal:"صفقة جديدة",copyLink:"نسخ الرابط الموقّع",blocked:"ممنوع الوصول",blockedMsg:"هذه المنصة تعمل حصرياً داخل Pi Browser"},
    en:{title:"Cortex Escrow V12.2",subtitle:"Decentralized Escrow Protocol",login:"Login with Pi Protocol",dealType:"Deal Type",details:"Deal Details",terms:"Deal Terms",delivery:"Delivery Days",price:"Price in Pi",sellerWallet:"Seller Wallet - Testnet",create:"Create Signed Smart Contract",deposit:"Deposit to Escrow",release:"Release Payment",newDeal:"New Deal",copyLink:"Copy Signed Link",blocked:"Access Denied",blockedMsg:"This platform works exclusively inside Pi Browser"}
};

const LANGUAGES = ['ar','en','es','fr','zh','hi','ru','de','ja','pt','it','tr','ko','bn','ur','id','vi','th','fa','sw','ha','yo','ig','zu','af','sq','am','hy','az','eu','be','bs','bg','ca','ceb','ny','zh-CN','zh-TW','hr','cs','da','nl','eo','et','tl','fi','fy','gl','ka','el','gu','ht','hmn','hu','is','ga','jv','kn','kk','km','rw','ku','ky','lo','la','lv','lt','lb','mk','mg','ms','ml','mt','mi','mr','mn','my','ne','no','or','ps','pl','pa','ro','sm','gd','sr','st','sn','sd','si','sk','sl','so','su','sv','tg','ta','te','uk','uz','cy','xh','yi'];

class CortexEscrow {
    constructor(){
        this.state = {user:null,contract:null,link:'',lang:'en',piReady:false};
        this.init();
    }

    async init(){
        try {
            this.setupLanguage();
            if(!this.isPiBrowser()){
                this.renderBlocked();
                return;
            }
            await this.waitForPiSDK();
            this.renderLogin();
            this.bindEvents();
        } catch(err) {
            this.renderError(err.message);
        }
    }

    isPiBrowser(){
        const ua = navigator.userAgent.toLowerCase();
        return ua.includes('pibrowser') || ua.includes('pi network') || ua.includes('pi-browser');
    }

    setupLanguage(){
        const browserLang = navigator.language.split('-')[0];
        this.state.lang = I18N[browserLang]? browserLang : 'en';
        document.documentElement.lang = this.state.lang;
        document.documentElement.dir = ['ar','fa','ur','he'].includes(this.state.lang)? 'rtl' : 'ltr';

        const select = document.getElementById('langSelect');
        if(!select) return;

        LANGUAGES.slice(0,100).forEach(lang => {
            const opt = document.createElement('option');
            opt.value = lang;
            opt.textContent = lang.toUpperCase();
            if(lang === this.state.lang) opt.selected = true;
            select.appendChild(opt);
        });
    }

    t(key){
        return (I18N[this.state.lang] && I18N[this.state.lang][key])
           ? I18N[this.state.lang][key]
            : (I18N.en[key] || key);
    }

    async waitForPiSDK(){
        let retries = 0;
        while(typeof Pi === 'undefined' && retries < 30){
            await new Promise(r => setTimeout(r, 100));
            retries++;
        }
        if(typeof Pi === 'undefined') throw new Error('Pi SDK load timeout');

        try {
            Pi.init({version:"2.0", sandbox:true, appId:CONFIG.APP_ID});
            this.state.piReady = true;
        } catch(err) {
            throw new Error('Pi.init failed: ' + err.message);
        }
    }

    renderBlocked(){
        document.getElementById('app').innerHTML = `
            <div class="blocked-screen">
                <h1>🔒</h1>
                <h2>${this.t('blocked')}</h2>
                <p>${this.t('blockedMsg')}</p>
                <p style="margin-top:16px;color:var(--muted)">افتح الرابط من تطبيق Pi Browser الرسمي</p>
            </div>
        `;
    }

    renderError(msg){
        document.getElementById('app').innerHTML = `
            <div class="container">
                <h2>خطأ في التحميل</h2>
                <div class="status err">${msg}</div>
                <p style="color:var(--muted)">تأكد أنك فاتح من Pi Browser وأن الموقع HTTPS</p>
            </div>
        `;
    }

    renderLogin(){
        document.getElementById('app').innerHTML = `
            <div class="container">
                <h2>${this.t('title')}</h2>
                <p class="subtitle">${this.t('subtitle')} - ${CONFIG.NETWORK.toUpperCase()}</p>
                <button class="btn" id="loginBtn">🔐 ${this.t('login')}</button>
                <div id="status"></div>
            </div>
        `;
    }

    renderApp(){
        document.getElementById('app').innerHTML = `
            <div class="container">
                <h2>${this.t('title')}</h2>
                <div class="user-card" id="userInfo"></div>

                <label>${this.t('dealType')}</label>
                <select id="dealType">
                    <option value="digital">Digital Product</option>
                    <option value="service">Service</option>
                    <option value="physical">Physical Product</option>
                </select>

                <label>${this.t('details')}</label>
                <textarea id="dealDetails" rows="3" placeholder="Detailed description with quality standards..."></textarea>

                <div class="terms-box">
                    <label>${this.t('terms')}</label>
                    <textarea id="termsText" rows="2" placeholder="e.g., New product, 30-day warranty, inspection within 48h"></textarea>
                    <label>${this.t('delivery')}</label>
                    <input type="number" id="deliveryDays" value="7" min="1" max="90">
                </div>

                <label>${this.t('price')}</label>
                <input type="number" id="dealAmount" step="0.0001" min="0.0001" max="100000">
                <div id="feeBreakdown"></div>

                <label>${this.t('sellerWallet')}</label>
                <input type="text" id="sellerWallet" placeholder="G...56 characters">

                <button class="btn" id="deployBtn">📝 ${this.t('create')}</button>
                <button class="btn" id="depositBtn" style="display:none">💰 ${this.t('deposit')}</button>
                <button class="btn" id="releaseBtn" style="display:none">🔓 ${this.t('release')}</button>
                <button class="btn" id="newDealBtn">🔄 ${this.t('newDeal')}</button>

                <div id="status"></div>
                <div id="contractInfo"></div>
                <div id="shareLink" class="link-box" style="display:none"></div>
                <button class="btn" id="copyLinkBtn" style="display:none">📋 ${this.t('copyLink')}</button>
            </div>
        `;
        this.updateUserInfo();
    }

    bindEvents(){
        document.addEventListener('change', (e) => {
            if(e.target.id === 'langSelect'){
                this.state.lang = e.target.value;
                document.documentElement.lang = this.state.lang;
                document.documentElement.dir = ['ar','fa','ur','he'].includes(this.state.lang)? 'rtl' : 'ltr';
                this.renderLogin();
            }
            if(e.target.id === 'dealAmount') this.updateFeeBreakdown();
        });

        document.addEventListener('click', (e) => {
            if(e.target.id === 'loginBtn') this.handleLogin();
            if(e.target.id === 'deployBtn') this.handleDeploy();
            if(e.target.id === 'depositBtn') this.handleDeposit();
            if(e.target.id === 'releaseBtn') this.handleRelease();
            if(e.target.id === 'newDealBtn') this.resetState();
            if(e.target.id === 'copyLinkBtn') this.copyLink();
        });
    }

    async handleLogin(){
        if(!this.state.piReady) return this.showStatus('Pi SDK not ready','err');
        try{
            this.showStatus('Authenticating via Pi Protocol...','warn');
            const auth = await Pi.authenticate(['username','payments'], this.onIncompletePayment);
            this.state.user = auth.user;
            this.renderApp();
            this.showStatus('✅ Connected successfully','ok');
        }catch(err){
            this.showStatus(`Auth failed: ${err.message}`,'err');
        }
    }

    async handleDeploy(){
        const deal = this.collectDealData();
        if(!deal) return;

        this.showStatus('Creating smart contract on Pi Network...','info');

        try{
            const res = await fetch(`${CONFIG.GENESIS_API}/genesis/deploy`,{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                  ...deal,
                    seller:this.state.user.uid,
                    escrowAddress:CONFIG.ESCROW_ADDRESS,
                    testnet:true,
                    protocolVersion:CONFIG.VERSION,
                    termsHash:await this.hashTerms(deal.terms)
                })
            });

            const data = await res.json();
            if(!res.ok ||!data.success) throw new Error(data.reason || 'Server error');

            this.state.contract = {...data,...deal};
            this.state.contractId = data.contractId; // FIXED: كان ناقص
            this.state.link = `${location.origin}/?g=${data.contractId}&t=${CONFIG.NETWORK}`;

            this.updateContractUI();
            this.showStatus('✅ Smart contract created and registered','ok');
        }catch(err){
            this.showStatus(`Deploy failed: ${err.message}`,'err');
        }
    }

    async handleDeposit(){
        if(!this.state.contractId) return this.showStatus('No contract ID found','err');

        try{
            const fees = this.calculateFees(this.state.contract.price);
            this.showStatus('Open Pi wallet to approve escrow deposit...','warn');

            await Pi.createPayment({
                amount:fees.buyerPays,
                memo:`Cortex:${this.state.contractId}`,
                metadata:{
                    contractId:this.state.contractId,
                    type:'escrow_deposit',
                    protocol:CONFIG.VERSION,
                    termsHash:await this.hashTerms(this.state.contract.terms)
                }
            }, this.onIncompletePayment);

            this.showStatus('✅ Funds locked in smart contract','ok');
            document.getElementById('depositBtn').style.display='none';
            document.getElementById('releaseBtn').style.display='block';
        }catch(err){
            this.showStatus(`Deposit failed: ${err.message}`,'err');
        }
    }

    async handleRelease(){
        if(!this.state.contractId) return this.showStatus('No contract ID found','err');

        try{
            this.showStatus('Verifying terms and releasing payment...','info');
            const res = await fetch(`${CONFIG.GENESIS_API}/genesis/release`,{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                    contractId:this.state.contractId,
                    buyer:this.state.user.uid,
                    termsAcknowledged:true
                })
            });

            const data = await res.json();
            if(!data.success) throw new Error(data.reason);

            this.showStatus('✅ Distribution complete: Seller 99% | Platform 1% | AI 0.3%','ok');
            document.getElementById('releaseBtn').style.display='none';
        }catch(err){
            this.showStatus(`Release failed: ${err.message}`,'err');
        }
    }

    collectDealData(){
        const details = document.getElementById('dealDetails')?.value.trim();
        const price = parseFloat(document.getElementById('dealAmount')?.value);
        const sellerWallet = document.getElementById('sellerWallet')?.value.trim();

        if(!details || isNaN(price) || price < 0.0001) {
            this.showStatus('Enter valid details and price','err'); return null;
        }
        if(!sellerWallet || sellerWallet.length < 56) {
            this.showStatus('Enter valid Testnet wallet address','err'); return null;
        }

        return {
            details,
            price,
            dealType:document.getElementById('dealType').value,
            sellerWallet,
            terms:{
                text:document.getElementById('termsText')?.value.trim(),
                deliveryDays:parseInt(document.getElementById('deliveryDays')?.value),
                timestamp:Date.now()
            }
        };
    }

    calculateFees(price){
        const p = parseFloat(price);
        const sellerFee = Math.floor(p*0.01*1e7)/1e7;
        const buyerFee = Math.ceil(p*0.01*1e7)/1e7;
        const aiFee = Math.floor(p*0.001*1e7)/1e7;
        const platformFee = Math.floor((sellerFee+buyerFee-aiFee*3)*1e7)/1e7;

        return {
            price:p,
            sellerReceives:Math.floor((p-sellerFee)*1e7)/1e7,
            buyerPays:Math.ceil((p+buyerFee)*1e7)/1e7,
            sellerFee,buyerFee,platformFee,aiFee,
            networkFee:0.01
        };
    }

    updateFeeBreakdown(){
        const price = document.getElementById('dealAmount')?.value;
        const fees = this.calculateFees(price);
        if(!fees) return document.getElementById('feeBreakdown').innerHTML='';

        document.getElementById('feeBreakdown').innerHTML = `
            <div class="fee-grid">
                <div class="fee-item">Seller Receives<strong>${fees.sellerReceives} π</strong></div>
                <div class="fee-item">Buyer Pays<strong>${fees.buyerPays} π</strong></div>
                <div class="fee-item">Platform Fee<strong>${fees.platformFee} π</strong></div>
                <div class="fee-item">AI Bonus<strong>${(fees.aiFee*3).toFixed(7)} π</strong></div>
            </div>
            <p style="font-size:12px;color:var(--muted)">+ 0.01 π Pi Network fee</p>
        `;
    }

    updateUserInfo(){
        document.getElementById('userInfo').innerHTML = `
            <strong>@${this.state.user.username}</strong><br>
            <span style="font-size:12px;color:var(--muted)">UID: ${this.state.user.uid}</span><br>
            <span style="color:var(--warn)">TESTNET • Protocol ${CONFIG.VERSION}</span>
        `;
    }

    updateContractUI(){
        document.getElementById('contractInfo').innerHTML = `
            <div class="status ok">ContractID: ${this.state.contract.hash}</div>
        `;
        document.getElementById('shareLink').textContent=this.state.link;
        document.getElementById('shareLink').style.display='block';
        document.getElementById('copyLinkBtn').style.display='block';
        document.getElementById('depositBtn').style.display='block';
    }

    async hashTerms(terms){
        const msg = JSON.stringify(terms);
        const buf = new TextEncoder().encode(msg);
        const hash = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    onIncompletePayment = (payment) => Pi.completePayment(payment.identifier);

    showStatus(msg,type='warn'){
        const statusEl = document.getElementById('status');
        if(statusEl) statusEl.innerHTML=`<div class="status ${type}">${msg}</div>`;
        if(type!=='err') setTimeout(()=>{if(statusEl) statusEl.innerHTML='';},8000);
    }

    resetState(){
        this.state.contract=null;
        this.state.contractId=null;
        this.state.link='';
        this.renderApp();
        this.showStatus('Ready for new contract','ok');
    }

    copyLink(){
        navigator.clipboard.writeText(this.state.link);
        this.showStatus('✅ Link copied','ok');
    }
}

new CortexEscrow();
</script>
</body>
</html>
