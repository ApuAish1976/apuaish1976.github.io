<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cortex Test</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="background:#0f172a;color:white;text-align:center;padding:50px;font-family:sans-serif">
  <h1>Cortex Sandbox Test</h1>
  <button onclick="login()" style="padding:15px 30px;font-size:18px;background:#6366f1;border:none;border-radius:8px;color:white;margin:10px">1. Login</button>
  <button onclick="pay()" style="padding:15px 30px;font-size:18px;background:#10b981;border:none;border-radius:8px;color:white;margin:10px">2. Pay 0.1 Test</button>
  <div id="log" style="background:#1e293b;padding:20px;border-radius:8px;margin-top:20px;text-align:left">Ready to test...</div>

  <script>
    // رابط الـ Backend حقك من Render
    const BACKEND_URL = "https://-pi-backend-kv9g.onrender.com";

    function onIncompletePaymentFound(payment) {
      addLog('Found incomplete payment: ' + payment.identifier);
      // نكمل الدفع من السيرفر
      fetch(BACKEND_URL + '/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paymentId: payment.identifier, txid: payment.transaction.txid })
      });
    }

    Pi.init({ version: "2.0", sandbox: true });
    addLog('SDK Initialized. Sandbox: true');

    function addLog(text) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += '<br>> ' + text;
    }

    async function login() {
      try {
        addLog('Button clicked. Starting auth...');
        const scopes = ['payments'];
        const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
        addLog('Login SUCCESS: ' + auth.user.username);
      } catch (error) {
        addLog('Login FAILED: ' + error.message);
      }
    }

    function pay() {
      addLog('Creating payment...');
      Pi.createPayment({
        amount: 0.1,
        memo: "Test Payment",
        metadata: { test: "1", orderId: Date.now() }
      }, {
        onReadyForServerApproval: function(paymentId) {
          addLog('Payment needs approval: ' + paymentId);
          
          // نرسل للسيرفر يوافق
          fetch(BACKEND_URL + '/approve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentId: paymentId })
          })
          .then(res => res.json())
          .then(data => {
            if(data.status === 'approved') {
              addLog('Server approved payment ✅');
            } else {
              addLog('Server approval FAILED');
            }
          })
          .catch(err => addLog('Approve error: ' + err));
        },
        onReadyForServerCompletion: function(paymentId, txid) {
          addLog('Payment SUCCESS! TX: ' + txid);
          
          // نرسل للسيرفر يكمل العملية
          fetch(BACKEND_URL + '/complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentId: paymentId, txid: txid })
          })
          .then(res => res.json())
          .then(data => {
            if(data.status === 'completed') {
              addLog('Server completed payment ✅');
              alert('تم الدفع التجريبي بنجاح');
            }
          })
          .catch(err => addLog('Complete error: ' + err));
        },
        onCancel: function(paymentId) {
          addLog('Payment cancelled: ' + paymentId);
        },
        onError: function(error, payment) {
          addLog('Payment ERROR: ' + error.message);
          alert('فشل الدفع: ' + error.message);
        }
      });
    }
  </script>
</body>
</html>
