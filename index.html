<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortex Escrow - ضمان Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:'Cairo',sans-serif;padding:20px;text-align:right}
input,select,textarea{width:100%;padding:12px;margin:8px 0;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff}
button{width:100%;padding:14px;margin:8px 0;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer}
button:disabled{background:#333;cursor:not-allowed}
.success{background:#00ff88;color:#000;padding:12px;border-radius:8px;margin:10px 0}
.error{background:#ff4444;padding:12px;border-radius:8px;margin:10px 0}
#negotiationBox,#termsModal{display:none;margin-top:15px;padding:15px;background:#1a1a1a;border-radius:8px;border:1px solid #333}
</style>
</head>
<body>

<h2>🔒 Cortex Escrow</h2>
<div id="authStatus">جاري الاتصال بـ Pi...</div>

<div id="createDealForm" style="display:none;">
  <label>نوع الصفقة</label>
  <select id="dealType">
    <option value="منتج رقمي">منتج رقمي</option>
    <option value="منتج مادي">منتج مادي</option>
    <option value="خدمة">خدمة</option>
  </select>

  <label>تفاصيل الصفقة</label>
  <textarea id="dealDetails" rows="3" placeholder="مثال: بيع 1 Pi"></textarea>

  <label>السعر بـ Pi</label>
  <input type="number" id="dealAmount" step="0.01" value="1">

  <button onclick="openTermsModal()">إضافة شروط الصفقة</button>
  <button onclick="createEscrowContract()">إنشاء العقد الذكي</button>

  <div id="negotiationBox">
    <h4>تفاوض على السعر</h4>
    <input type="number" id="counterOffer" placeholder="سعرك المقترح">
    <button onclick="sendCounterOffer()">إرسال عرض مضاد</button>
  </div>

  <div id="result"></div>
</div>

<div id="termsModal">
  <h3>شروط الصفقة</h3>
  <textarea id="terms" rows="4" placeholder="مثال: المنتج جديد، الضمان 30 يوم"></textarea>
  <label>مدة التسليم بالأيام</label>
  <input type="number" id="deliveryDays" value="7">
  <button onclick="saveTerms()">حفظ الشروط</button>
  <button onclick="closeModal()">إلغاء</button>
</div>

<script>
let currentUser = null;
let currentDealId = null;

Pi.init({version:"2.0", sandbox:true, appId:"حط-هنا-App-ID"});

Pi.authenticate(['username','payments'], onIncompletePaymentFound)
.then(auth => {
  currentUser = auth.user;
  document.getElementById('authStatus').innerHTML = 
    `<div class="success">مرحباً ${auth.user.username} ✅</div>`;
  document.getElementById('createDealForm').style.display = 'block';
})
.catch(err => {
  document.getElementById('authStatus').innerHTML = 
    `<div class="error">فشل تسجيل الدخول: ${err}</div>`;
});

function onIncompletePaymentFound(payment){}

function openTermsModal(){document.getElementById('termsModal').style.display='block'}
function closeModal(){document.getElementById('termsModal').style.display='none'}

function saveTerms(){
  const terms = {
    text: document.getElementById('terms').value,
    deliveryDays: document.getElementById('deliveryDays').value
  };
  localStorage.setItem('dealTerms_' + currentDealId, JSON.stringify(terms));
  closeModal();
  alert('تم حفظ الشروط');
}

// 1. تعديل: دالة إنشاء العقد مع النشر التلقائي
async function createEscrowContract(){
  const dealData = {
    details: document.getElementById('dealDetails').value,
    type: document.getElementById('dealType').value,
    amount: document.getElementById('dealAmount').value,
    sellerWallet: currentUser.uid
  };

  try{
    const payment = await Pi.createPayment({
      amount: parseFloat(dealData.amount),
      memo: `Cortex Escrow: ${dealData.details}`,
      metadata: {dealData}
    },{
      onReadyForServerApproval: async (paymentId) => {
        currentDealId = paymentId;
        const link = `${window.location.origin}/?g=${paymentId}&testnet=1`;
        
        // نشر الصفقة تلقائياً
        publishDeal(dealData, link, paymentId);
        
        document.getElementById('result').innerHTML = `
          <div class="success">
            تم إنشاء العقد ✅<br>
            رابط الصفقة: <br>
            <input type="text" value="${link}" readonly>
          </div>
        `;
        document.getElementById('negotiationBox').style.display='block';
      },
      onCancel: () => alert('تم إلغاء العملية'),
      onError: (err) => alert('خطأ: ' + err)
    });
  }catch(err){
    alert('فشل إنشاء العقد: ' + err);
  }
}

// 2. تعديل: دالة نشر الصفقة في القائمة العامة
function publishDeal(dealData, link, paymentId){
  const deal = {
    id: paymentId,
    title: dealData.details,
    type: dealData.type,
    amount: dealData.amount,
    link: link,
    status: "pending",
    statusText: "في انتظار الدفع",
    createdAt: Date.now()
  };

  let publicDeals = JSON.parse(localStorage.getItem('publicDeals') || '[]');
  publicDeals.unshift(deal);
  localStorage.setItem('publicDeals', JSON.stringify(publicDeals));
}

// 3. تعديل: دالة التفاوض على السعر
async function sendCounterOffer(){
  const newPrice = document.getElementById('counterOffer').value;
  if(!newPrice || newPrice <= 0){alert('ادخل سعر صحيح');return;}

  document.getElementById('dealAmount').value = newPrice;
  alert('تم تحديث السعر. اضغط "إنشاء العقد الذكي" لإرسال العرض الجديد للمشتري');
}
</script>
</body>
</html>
