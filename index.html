    <style>

 .genesis { background: linear-gradient(145deg,#13132B,#0F0F23); border: 1px solid var(--p); border-radius: 28px; padding: 20px; max-width: 540px; margin: 0 auto; box-shadow: 0 0 60px rgba(124,58,237,0.25), inset 0 1px 0 rgba(255,255,255,0.05); }

  .voice-realm::after { inset: -12px; opacity: 0.3; filter: blur(10px); }

        @keyframes spin { to { transform: rotate(360deg); } }

        textarea { resize: vertical; min-height: 100px; }
        button { background: linear-gradient(90deg,var(--p),var(--s)); border: none; font-weight: 800; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
  .quantum-link { background: #0F0F23; border: 1px dashed var(--p); padding: 14px; border-radius: 16px; font-family: monospace; font-size: 9px; margin: 16px 0; display: none; word-break: break-all; }

  .verdict.approve { color: var(--ok); }
  .verdict.reject { color: var(--err); }
  .status { padding: 14px; border-radius: 16px; text-align: center; margin-top: 16px; font-size: 13px; font-weight: 700; display: none; }
  .status.ok { background: rgba(16,185,129,0.15); color: var(--ok); border: 1px solid var(--ok); display: block; }
  .status.err { background: rgba(239,68,68,0.15); color: var(--err); border: 1px solid var(--err); display: block; }
  .status.ai { background: rgba(124,58,237,0.15); color: #A78BFA; border: 1px solid var(--p); display: block; }
  .hidden { display: none!important; }
  .contract-card { background: #0F0F23; border: 1px solid #374151; border-radius: 16px; padding: 16px; margin: 16px 0; font-size: 13px; line-height: 1.7; }
  .contract-card b { color: #A78BFA; }
  .label { font-size: 12px; color: #9CA3AF; margin: 12px 4px 4px; font-weight: 700; }
  .pi-input { position: relative; }
  .pi-input span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #A78BFA; font-weight: 900; font-size: 18px; pointer-events: none; }
  .pi-input input { padding-left: 50px; }
  .fee-box { background: #1F1F3A; border: 1px solid #374151; border-radius: 12px; padding: 12px; margin: 12px 0; font-size: 11px; color: #9CA3AF; }
  .fee-box b { color: #A78BFA; }
    </style>

<body>

        <div class="protocol">GENESIS PROTOCOL V9.0 | AUDITED FINAL</div>
        <div class="logo-wrap">
            <svg class="logo-svg" viewBox="0 0 64 64" fill="none">
                <defs><linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#EC4899"/></linearGradient></defs>
                <path d="M32 4L12 24L32 60L52 24L32 4Z" fill="url(#diamondGrad)" opacity="0.9"/>
                <path d="M32 4L22 24L32 44L42 24L32 4Z" fill="white" opacity="0.3"/>
                <circle cx="32" cy="24" r="3" fill="white"/><circle cx="22" cy="24" r="2" fill="white" opacity="0.6"/><circle cx="42" cy="24" r="2" fill="white" opacity="0.6"/><circle cx="32" cy="44" r="2" fill="white" opacity="0.6"/>
                <line x1="32" y1="24" x2="22" y2="24" stroke="white" stroke-width="1" opacity="0.5"/><line x1="32" y1="24" x2="42" y2="24" stroke="white" stroke-width="1" opacity="0.5"/><line x1="32" y1="24" x2="32" y2="44" stroke="white" stroke-width="1" opacity="0.5"/>

<script nonce="CORTEX90">
'use strict';
Pi.init({ version: "2.0", sandbox: false });
const GENESIS_API = 'https://pi-backend-kv9g.onrender.com';
const AI_TRIBUNAL = ['GPT-5-Turbo', 'Claude-Opus-4', 'Gemini-Ultra-2.0'];
const PLATFORM_FEE_SELLER = 0.01;
const PLATFORM_FEE_BUYER = 0.01;
let currentUser = null, activeContract = null, currentLang = 'ar-SA';

const DEAL_TYPES = {
    digital: { name: 'منتج رقمي', delivery: 'تسليم فوري عبر الرابط/الكود', dispute: '7 أيام ضمان استرجاع' },
    service: { name: 'خدمة', delivery: 'حسب الاتفاق - مراحل', dispute: 'محكمة AI تحكم بالإنجاز' },
    physical: { name: 'منتج ملموس', delivery: 'شحن + رقم تتبع', dispute: 'إثبات استلام مطلوب' },
    other: { name: 'أخرى', delivery: 'حسب الشروط', dispute: 'حكم محكمة AI' }
};

const LANGS = {'ar-SA':'🇸🇦 عربي','en-US':'🇺🇸 EN','zh-CN':'🇨🇳 中文','hi-IN':'🇮🇳 हिंदी','es-ES':'🇪🇸 ES','fr-FR':'🇫🇷 FR','pt-BR':'🇧🇷 PT','ru-RU':'🇷🇺 RU','ja-JP':'🇯🇵 日本語','de-DE':'🇩🇪 DE','tr-TR':'🇹🇷 TR','ko-KR':'🇰🇷 한국어'};

function initLang() {
    document.getElementById('langScroller').innerHTML = Object.entries(LANGS).map(([code,name]) =>
        `<div class="lang-chip ${code==='ar-SA'?'active':''}" data-lang="${code}">${name}</div>`
    ).join('');
    document.querySelectorAll('.lang-chip').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang, b)));
}
initLang();

function setLang(code, el) {
    currentLang = code;
    document.querySelectorAll('.lang-chip').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    document.documentElement.lang = code.split('-')[0];
    document.documentElement.dir = code.startsWith('ar')?'rtl':'ltr';
}

document.querySelectorAll('.io-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.io-btn').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        const mode = btn.dataset.mode;
        document.getElementById('voiceMode').classList.toggle('hidden', mode!=='voice');
        document.getElementById('textMode').classList.toggle('hidden', mode!=='text');
    });
});

function showStatus(msg, type='ai') {
    const el = document.getElementById('status');
    el.textContent = msg; el.className = `status ${type}`;
}

function parsePiAmount(str) {
    if (!/^\d+(\.\d{1,7})?$/.test(str)) return null;
    const num = parseFloat(str);
    if (isNaN(num) || num < 0.0000001 || num > 100000) return null;
    return Math.round(num * 10000000) / 10000000;
}

function formatPiAmount(num) {
    return Number(num).toFixed(7);
}

function calculateFees(price) {
    const sellerFee = Math.round(price * PLATFORM_FEE_SELLER * 10000000) / 10000000;
    const buyerFee = Math.round(price * PLATFORM_FEE_BUYER * 10000000) / 10000000;
    const sellerReceives = Math.round((price - sellerFee) * 10000000) / 10000000;
    const buyerPays = Math.round((price + buyerFee) * 10000000) / 10000000;
    return { price, sellerFee, buyerFee, sellerReceives, buyerPays };
}

document.getElementById('textInputPrice').addEventListener('input', (e) => {
    const price = parsePiAmount(e.target.value);
    if (price) {
        const f = calculateFees(price);
        document.getElementById('feeCalc').textContent = `البائع يستلم ${formatPiAmount(f.sellerReceives)} π | المشتري يدفع ${formatPiAmount(f.buyerPays)} π`;
    } else {
        document.getElementById('feeCalc').textContent = 'أدخل السعر لحساب العمولة';
    }
});

document.getElementById('counterOffer').addEventListener('input', (e) => {
    const price = parsePiAmount(e.target.value);
    if (price) {
        const f = calculateFees(price);
        document.getElementById('buyerTotal').textContent = `${formatPiAmount(f.buyerPays)} π`;
    }
});

document.getElementById('loginBtn').addEventListener('click', piLogin);
document.getElementById('voiceRealm').addEventListener('click', invokeVoiceAI);
document.getElementById('deployBtn').addEventListener('click', () => deployGenesisContract());
document.getElementById('copyBtn').addEventListener('click', copyQuantumLink);
document.getElementById('tribunalBtn').addEventListener('click', invokeAITribunal);
document.getElementById('depositBtn').addEventListener('click', depositToQuantumVault);
document.getElementById('releaseBtn').addEventListener('click', executeRelease);

async function piLogin() {
    try {
        showStatus('جاري تسجيل الدخول...', 'ai');
        const scopes = ['username', 'payments', 'wallet_address'];
        const auth = await Pi.authenticate(scopes, onIncompletePayment);
        currentUser = auth.user;
        if (!currentUser?.wallet_address) throw new Error('عنوان المحفظة غير متوفر. تأكد من تفعيل المحفظة في Pi Browser');
        document.getElementById('welcome').textContent = `@${auth.user.username}`;
        document.getElementById('loginBtn').textContent = 'تم الربط';
        document.getElementById('loginBtn').disabled = true;
        showStatus(`مرحباً @${auth.user.username}`, 'ok');
    } catch(e) {
        showStatus(`فشل تسجيل الدخول: ${e.message}`, 'err');
    }
}

function invokeVoiceAI() {
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.lang = currentLang; rec.continuous = false; rec.interimResults = false;
    document.getElementById('voiceRealm').classList.add('recording');
    rec.onresult = e => {
        const text = e.results[0][0].transcript;
        document.getElementById('voiceTranscript').textContent = text;
        deployGenesisContract(text);
    };
    rec.onend = () => document.getElementById('voiceRealm').classList.remove('recording');
    rec.onerror = e => showStatus(`خطأ صوتي: ${e.error}`, 'err');
    rec.start();
}

async function deployGenesisContract(text=null) {
    text = text || document.getElementById('textInput').value.trim();
    const price = parsePiAmount(document.getElementById('textInputPrice').value);

    if (!text) return showStatus('اكتب تفاصيل الصفقة أولاً', 'err');
    if (price === null) return showStatus('السعر غير صحيح. أقل سعر: 0.0000001 π', 'err');

    const dealType = document.getElementById('dealType').value;
    showStatus(`محكمة الذكاء الاصطناعي تحلل صفقة ${DEAL_TYPES[dealType].name}...`, 'ai');

    const sellerWallet = currentUser?.wallet_address || null;
    if (currentUser &&!sellerWallet) return showStatus('خطأ: عنوان المحفظة غير متوفر. سجل دخول مرة أخرى', 'err');

    const fees = calculateFees(price);

    const res = await fetch(`${GENESIS_API}/genesis/deploy`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            text, price, currency: 'Pi',
            fees,
            lang: currentLang,
            dealType, dealTypeName: DEAL_TYPES[dealType].name,
            seller: currentUser?.uid || null,
            sellerName: currentUser?.username || 'Anonymous Seller',
            sellerWallet,
            agents: AI_TRIBUNAL
        })
    });
    const data = await res.json();
    if (!data.success) return showStatus(`المحكمة رفضت: ${data.reason}`, 'err');

    activeContract = data.contract;
    document.getElementById('contractHash').textContent = `ContractID: ${data.contract.hash}`;
    const link = `https://apuaish1976.github.io/?g=${data.contract.id}`;
    document.getElementById('quantumLink').textContent = link;
    document.getElementById('quantumLink').style.display = 'block';
    document.getElementById('copyBtn').classList.remove('hidden');

    const tribunal = document.getElementById('sellerTribunal');
    tribunal.style.display = 'block';
    tribunal.innerHTML = `<b>حكم بالإجماع: موافق - ${DEAL_TYPES[dealType].name}</b>` + data.votes.map(v =>
        `<div class="judge"><span>${v.agent}</span><span class="verdict approve">✓ ${v.confidence}%</span></div>`
    ).join('') + `<div style="margin-top:12px;font-size:11px
