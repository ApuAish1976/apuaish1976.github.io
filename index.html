<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Escrow</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root {
            --primary-color: #7c3aed;
            --background-color: #f0f2f5;
            --text-color: #1f2937;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        p {
            color: #6b7280;
            margin-bottom: 2rem;
        }
        .input-group {
            margin-bottom: 1rem;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #6d28d9;
        }
        #status {
            margin-top: 1.5rem;
            font-weight: 500;
            min-height: 24px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💜</div>
        <h1>Cortex Escrow</h1>
        <p>وسيط ضمان آمن ولامركزي على شبكة Pi</p>
        
        <div id="login-section">
            <button id="login-button">تسجيل الدخول بـ Pi</button>
        </div>

        <div id="app-section" class="hidden">
            <div class="input-group">
                <label for="amount">المبلغ (Pi)</label>
                <input type="number" id="amount" placeholder="مثال: 10" value="1">
            </div>
            <div class="input-group">
                <label for="address">عنوان التسليم</label>
                <input type="text" id="address" placeholder="أدخل عنوانك الكامل">
            </div>
            <button id="create-deal-button">إنشاء صفقة ضمان جديدة</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const Pi = window.Pi;
        Pi.init({ version: "2.0", sandbox: true });
        
        const BACKEND_URL = 'https://pi-backend-kv9g.onrender.com';
        const loginButton = document.getElementById('login-button');
        const createDealButton = document.getElementById('create-deal-button');
        const loginSection = document.getElementById('login-section');
        const appSection = document.getElementById('app-section');
        const statusDiv = document.getElementById('status');
        const amountInput = document.getElementById('amount');
        const addressInput = document.getElementById('address');

        let currentUser = null;

        loginButton.addEventListener('click', async () => {
            try {
                statusDiv.textContent = 'جاري طلب الإذن...';
                const scopes = ['username', 'payments'];
                currentUser = await Pi.authenticate(scopes, onIncompletePaymentFound);
                loginSection.classList.add('hidden');
                appSection.classList.remove('hidden');
                statusDiv.textContent = `أهلاً بك، ${currentUser.username}!`;
            } catch (err) {
                statusDiv.textContent = `فشل تسجيل الدخول: ${err.message}`;
            }
        });

        createDealButton.addEventListener('click', async () => {
            const amount = parseFloat(amountInput.value);
            const address = addressInput.value.trim();

            if (!amount || amount <= 0) {
                statusDiv.textContent = 'الرجاء إدخال مبلغ صحيح.';
                return;
            }
            if (!address) {
                statusDiv.textContent = 'الرجاء إدخال عنوان التسليم.';
                return;
            }

            createDealButton.disabled = true;
            statusDiv.textContent = 'جاري تجهيز الدفع...';
            
            const paymentData = {
                amount: amount,
                memo: `صفقة ضمان Cortex لعنوان: ${address}`,
                metadata: { delivery_address: address }
            };

            const callbacks = {
                onReadyForServerApproval: (paymentId) => {
                    statusDiv.textContent = 'بانتظار موافقة الخادم...';
                    fetch(`${BACKEND_URL}/payments/approve`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId })
                    });
                },
                onReadyForServerCompletion: (paymentId, txid) => {
                    statusDiv.textContent = 'اكتمل الدفع! جاري حفظ الصفقة...';
                    fetch(`${BACKEND_URL}/payments/complete`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId, txid })
                    });
                    createDealButton.disabled = false;
                },
                onCancel: (paymentId) => {
                    statusDiv.textContent = 'تم إلغاء عملية الدفع.';
                    createDealButton.disabled = false;
                },
                onError: (error, payment) => {
                    statusDiv.textContent = `حدث خطأ: ${error.message}`;
                    createDealButton.disabled = false;
                }
            };

            Pi.createPayment(paymentData, callbacks);
        });

        function onIncompletePaymentFound(payment) {
            console.log("Found an incomplete payment:", payment);
            statusDiv.textContent = 'لديك دفعة غير مكتملة. جاري استكمالها...';
            const paymentData = {
                amount: payment.amount,
                memo: payment.memo,
                metadata: payment.metadata
            };
            const callbacks = {
                onReadyForServerApproval: (paymentId) => {
                    fetch(`${BACKEND_URL}/payments/approve`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentId }) });
                },
                onReadyForServerCompletion: (paymentId, txid) => {
                    fetch(`${BACKEND_URL}/payments/complete`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentId, txid }) });
                },
                onCancel: () => {},
                onError: () => {}
            };
            Pi.createPayment(paymentData, callbacks);
        }
    </script>
</body>
</html>
