  <title>Cortex Escrow V12.11 · Pi Testnet</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --bg2: #10101a;
      --card: rgba(20, 20, 30, .94);
      --card2: rgba(28, 28, 42, .94);
      --accent: #7c6cff;
      --accent2: #22d3ee;
      --success: #00d084;
      --error: #ff4757;
      --warn: #ffa502;
      --text: #f1f2f6;
      --muted: #a4adba;
      --border: rgba(255,255,255,.12);
      --shadow: 0 18px 55px rgba(0,0,0,.35);
      --radius: 18px;
      --input-bg: rgba(255,255,255,.065);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(124,108,255,.22), transparent 34%),
        radial-gradient(circle at bottom left, rgba(34,211,238,.14), transparent 31%),
        linear-gradient(145deg, var(--bg), var(--bg2));
      color: var(--text);
      padding: 14px 14px calc(18px + var(--safe-bottom));
      line-height: 1.7;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 14px;
      background: var(--input-bg);
      color: var(--text);
      padding: 12px 13px;
      transition: .18s border-color, .18s box-shadow, .18s background;
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
      touch-action: auto;
      pointer-events: auto;
      caret-color: var(--accent2);
      min-height: 48px;
    }

    input::placeholder, textarea::placeholder { color: rgba(241,242,246,.48); }
    select option { background: #11111a; color: var(--text); }
    textarea { min-height: 112px; resize: vertical; }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(34,211,238,.58);
      box-shadow: 0 0 0 4px rgba(34,211,238,.10);
      background: rgba(255,255,255,.09);
    }

    .app { width: min(1080px, 100%); margin: 0 auto; display: block; }
    .hero {
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 8px);
      background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.035));
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: -120px auto auto -120px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(255,255,255,.15), transparent 62%);
      pointer-events: none;
    }
    .hero-inner { padding: 22px; display: grid; gap: 16px; position: relative; z-index: 1; }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), #4a3cff);
      box-shadow: 0 12px 35px rgba(124,108,255,.28);
      font-weight: 900;
      color: white;
    }
    h1 { font-size: clamp(1.55rem, 5vw, 2.55rem); line-height: 1.25; }
    h2 { font-size: 1.14rem; margin-bottom: 4px; }
    .subtitle, .muted { color: var(--muted); font-size: .91rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      border-radius: 999px;
      color: var(--text);
      font-size: .84rem;
      white-space: nowrap;
    }
    .badge.ok { border-color: rgba(0,208,132,.35); color: #a9ffd9; }
    .badge.warn { border-color: rgba(255,165,2,.45); color: #ffe0a6; }
    .badge.err { border-color: rgba(255,71,87,.45); color: #ffc0c6; }

    .grid { display: grid; grid-template-columns: 1.08fr .92fr; gap: 16px; margin-top: 16px; }
    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 10px 35px rgba(0,0,0,.20);
      overflow: hidden;
    }
    .card-header {
      padding: 16px 16px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card-body { padding: 16px; display: grid; gap: 13px; }
    .field { display: grid; gap: 7px; }
    .label-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    label { color: #fff; font-weight: 750; font-size: .94rem; }
    .hint { color: var(--muted); font-size: .81rem; }
    .row { display: grid; grid-template-columns: 1
