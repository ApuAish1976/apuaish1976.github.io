<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Test Payment</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f5f5f5; }
    button { font-size: 18px; padding: 15px 25px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; }
    .login-btn { background: #8e44ad; color: white; }
    .pay-btn { background: #27ae60; color: white; }
    .pay-btn:disabled { background: #95a5a6; }
    #log { margin-top: 20px; background: white; padding: 15px; border-radius: 8px; text-align: left; direction: ltr; max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Pi Payment Test</h1>
  <p>Click Login first, then Pay</p>
  
  <button id="loginBtn" class="login-btn">1. Login</button>
  <button id="payBtn" class="pay-btn" disabled>2. Pay 0.1 Test</button>
  
  <div id="log"></div>

  <script>
    // Backend URL - Make sure this is correct
    const BACKEND_URL = "https://pi-backend-kv9g.onrender.com";
    
    // Init Pi SDK - set sandbox: false for real Pi
    Pi.init({ version: "2.0", sandbox: true });
    
    let currentUser = null;
    
    // Log function
    function log(msg) {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML += `[${time}] ${msg}<br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(msg);
    }
    
    // Handle incomplete payments
    function onIncompletePaymentFound(payment) {
      log('Found incomplete payment: ' + payment.identifier);
    }
    
    // Login handler with correct scopes
    async function handleLogin() {
      log('Login button clicked. Starting auth...');
      try {
        const scopes = ['username', 'payments'];
        const authResult = await Pi.authenticate(scopes, onIncompletePaymentFound);
        currentUser = authResult.user;
        log('Login SUCCESS: ' + currentUser.username);
        document.getElementById('payBtn').disabled = false;
      } catch (err) {
        log('Login FAILED: ' + err.message);
      }
    }
    
    // Payment handler
    async function handlePayment() {
      if (!currentUser) {
        log('Please login first');
        return;
      }
      
      log('Starting payment...');
      try {
        await Pi.createPayment({
          amount: 0.1,
          memo: "Test payment from app",
          metadata: { test: true }
        }, {
          onReadyForServerApproval: function(paymentId) {
            log('Got paymentId: ' + paymentId + ' -> calling backend /approve');
            fetch(`${BACKEND_URL}/approve`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId: paymentId })
            }).then(res => res.json())
              .then(data => log('Approve response: ' + JSON.stringify(data)))
              .catch(err => log('Approve ERROR: ' + err.message));
          },
          
          onReadyForServerCompletion: function(paymentId, txid) {
            log('Payment completed on blockchain. txid: ' + txid);
            fetch(`${BACKEND_URL}/complete`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId: paymentId, txid: txid })
            }).then(res => res.json())
              .then(data => log('Complete response: ' + JSON.stringify(data)))
              .catch(err => log('Complete ERROR: ' + err.message));
          },
          
          onCancel: function(paymentId) {
            log('Payment cancelled: ' + paymentId);
          },
          
          onError: function(error, payment) {
            log('Payment ERROR: ' + error.message);
          }
        });
      } catch (err) {
        log('Create payment FAILED: ' + err.message);
      }
    }
    
    // Bind buttons
    document.getElementById('loginBtn').addEventListener('click', handleLogin);
    document.getElementById('payBtn').addEventListener('click', handlePayment);
    
    log('App loaded. Ready.');
  </script>
</body>
</html>
