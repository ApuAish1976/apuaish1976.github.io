<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://sdk.minepi.com https://*.minepi.com;
    connect-src 'self' https://pi-backend-kv9g.onrender.com https://api.minepi.com https://*.minepi.com;
    img-src 'self' data: https://*.minepi.com;
    style-src 'self' 'unsafe-inline';
    frame-src 'self' https://minepi.com https://*.minepi.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    upgrade-insecure-requests
  " />
  <title>Cortex Escrow V13.0 Stage 1.3 Payments Only</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --bg2: #10101a;
      --card: rgba(20, 20, 30, .94);
      --accent: #7c6cff;
      --accent2: #22d3ee;
      --success: #00d084;
      --error: #ff4757;
      --warn: #ffa502;
      --text: #f1f2f6;
      --muted: #a4adba;
      --border: rgba(255,255,255,.12);
      --shadow: 0 18px 55px rgba(0,0,0,.35);
      --radius: 18px;
      --input-bg: rgba(255,255,255,.065);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(124,108,255,.20), transparent 34%),
        radial-gradient(circle at bottom left, rgba(34,211,238,.13), transparent 31%),
        linear-gradient(145deg, var(--bg), var(--bg2));
      color: var(--text);
      padding: 14px 14px calc(34px + var(--safe-bottom));
      line-height: 1.7;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    a { color: var(--accent2); text-decoration: none; }
    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 14px;
      background: var(--input-bg);
      color: var(--text);
      padding: 12px 13px;
      transition: .18s border-color, .18s box-shadow, .18s background;
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
      touch-action: auto;
      pointer-events: auto;
      caret-color: var(--accent2);
      min-height: 48px;
    }

    input::placeholder, textarea::placeholder { color: rgba(241,242,246,.48); }
    select option { background: #11111a; color: var(--text); }
    textarea { min-height: 112px; resize: vertical; }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(34,211,238,.58);
      box-shadow: 0 0 0 4px rgba(34,211,238,.10);
      background: rgba(255,255,255,.09);
    }

    .app { width: min(1080px, 100%); margin: 0 auto; display: block; }
    .hero {
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 8px);
      background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.035));
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: -120px auto auto -120px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(255,255,255,.15), transparent 62%);
      pointer-events: none;
    }
    .hero-inner { padding: 22px; display: grid; gap: 16px; position: relative; z-index: 1; }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), #4a3cff);
      box-shadow: 0 12px 35px rgba(124,108,255,.28);
      font-weight: 900;
      color: white;
    }
    h1 { font-size: clamp(1.55rem, 5vw, 2.55rem); line-height: 1.25; }
    h2 { font-size: 1.14rem; margin-bottom: 4px; }
    .subtitle, .muted { color: var(--muted); font-size: .91rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      border-radius: 999px;
      color: var(--text);
      font-size: .84rem;
      white-space: nowrap;
    }
    .badge.ok { border-color: rgba(0,208,132,.35); color: #a9ffd9; }
    .badge.warn { border-color: rgba(255,165,2,.45); color: #ffe0a6; }
    .badge.err { border-color: rgba(255,71,87,.45); color: #ffc0c6; }

    .grid { display: grid; grid-template-columns: 1.08fr .92fr; gap: 16px; margin-top: 16px; }
    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 10px 35px rgba(0,0,0,.20);
      overflow: hidden;
    }
    .card-header {
      padding: 16px 16px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card-body { padding: 16px; display: grid; gap: 13px; }
    .field { display: grid; gap: 7px; }
    .label-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    label { color: #fff; font-weight: 750; font-size: .94rem; }
    .hint { color: var(--muted); font-size: .81rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .amount-wrap { display: grid; grid-template-columns: 1fr 76px; gap: 8px; align-items: center; }
    .currency-fixed {
      height: 100%; min-height: 48px; display: grid; place-items: center;
      border: 1px solid rgba(0,208,132,.30); border-radius: 14px;
      background: rgba(0,208,132,.08); color: #a9ffd9; font-weight: 900; user-select: none;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .actions.grid-actions { display: grid; grid-template-columns: 1fr 1fr; }
    .btn {
      border: 0; border-radius: 14px; min-height: 46px; padding: 11px 14px; cursor: pointer;
      font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--accent), #4a3cff);
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      transition: .18s transform, .18s opacity, .18s filter; text-align: center;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .52; cursor: not-allowed; filter: grayscale(.18); transform: none; }
    .btn-secondary { background: linear-gradient(135deg, #0ea5e9, #06b6d4); }
    .btn-good { background: linear-gradient(135deg, #16a34a, #00d084); }
    .btn-ghost { min-height: 42px; background: rgba(255,255,255,.08); border: 1px solid var(--border); color: var(--text); }
    .status-list { display: grid; gap: 9px; }
    .status-line {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border: 1px solid rgba(255,255,255,.09); background: rgba(255,255,255,.045);
      padding: 10px 12px; border-radius: 14px; overflow-wrap: anywhere;
    }
    .key { color: var(--muted); font-size: .88rem; flex: 0 0 auto; }
    .value { color: var(--text); font-weight: 750; text-align: left; direction: ltr; overflow-wrap: anywhere; }
    .readonly-view { background: rgba(255,255,255,.045); border-color: rgba(34,211,238,.18); }
    .spinner {
      width: 16px; height: 16px; display: none; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.40); border-top-color: #fff; animation: spin 1s linear infinite;
    }
    .btn.busy .spinner { display: inline-block; }
    .toast {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + var(--safe-bottom));
      z-index: 90;
      width: min(680px, calc(100% - 24px));
      margin: 0 auto;
      border: 1px solid var(--border);
      background: rgba(17,17,26,.96);
      color: var(--text);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 14px 45px rgba(0,0,0,.38);
      display: none;
      text-align: center;
    }
    .toast.show { display: block; }
    .toast.ok { border-color: rgba(0,208,132,.32); color: #caffea; }
    .toast.err { border-color: rgba(255,71,87,.32); color: #ffd0d5; }
    .toast.warn { border-color: rgba(255,165,2,.33); color: #ffe5b5; }
    .internal { display: none !important; }
    .footer { text-align: center; color: var(--muted); margin-top: 16px; font-size: .88rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 850px) {
      body { padding: 10px 10px calc(34px + var(--safe-bottom)); }
      .hero-inner { padding: 18px; }
      .grid, .row { grid-template-columns: 1fr; }
      .actions.grid-actions { grid-template-columns: 1fr; }
      .amount-wrap { grid-template-columns: 1fr 70px; }
    }
  </style>
</head>
<body>
  <noscript><div class="toast show err">JavaScript غير مفعل.</div></noscript>

  <main class="app" id="appRoot">
    <section class="hero" aria-labelledby="pageTitle">
      <div class="hero-inner">
        <div class="brand-row">
          <div class="brand">
            <div class="logo" aria-hidden="true">Pi</div>
            <div>
              <h1 id="pageTitle">Cortex Escrow</h1>
              <p class="subtitle">Pi Testnet Escrow</p>
            </div>
          </div>
          <div class="badges" aria-label="حالة التطبيق">
            <span class="badge warn" id="networkBadge">TESTNET</span>
            <span class="badge" id="backendBadge">Backend</span>
            <span class="badge ok">Pi</span>
          </div>
        </div>
      </div>
    </section>

    <section class="grid" id="mainGrid" aria-label="لوحة إنشاء صفقة ضمان">
      <section class="card" aria-label="إنشاء صفقة ضمان">
        <div class="card-header">
          <div>
            <h2>إنشاء صفقة ضمان</h2>
          </div>
        </div>

        <div class="card-body">
          <div class="field">
            <div class="label-row">
              <label for="description">وصف الصفقة</label>
              <span class="hint">مطلوب</span>
            </div>
            <textarea id="description" name="description" maxlength="1500" autocomplete="off" autocapitalize="sentences" spellcheck="true" placeholder="اكتب المنتج أو الخدمة، الكمية، المواصفات، طريقة التسليم، ومدة التنفيذ..."></textarea>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="dealTerms">شروط الصفقة إن وجدت</label>
              <span class="hint">اختياري</span>
            </div>
            <textarea id="dealTerms" name="dealTerms" maxlength="1500" autocomplete="off" autocapitalize="sentences" spellcheck="true" placeholder="مدة التسليم، شروط القبول، الضمان، أو أي اتفاق خاص..."></textarea>
          </div>

          <div class="row">
            <div class="field">
              <div class="label-row">
                <label for="dealType">نوع الصفقة</label>
              </div>
              <select id="dealType" name="dealType">
                <option value="service">خدمة</option>
                <option value="digital">منتج رقمي</option>
                <option value="physical">منتج مادي</option>
                <option value="other">أخرى</option>
              </select>
            </div>

            <div class="field">
              <div class="label-row">
                <label for="amount">السعر</label>
                <span class="hint">حتى 7 أرقام عشرية</span>
              </div>
              <div class="amount-wrap">
                <input id="amount" name="amount" inputmode="decimal" autocomplete="off" placeholder="1 أو 0.0000001" />
                <div class="currency-fixed" aria-label="العملة الثابتة">Pi</div>
              </div>
            </div>
          </div>

          <div class="actions grid-actions">
            <button type="button" class="btn" id="createBtn">
              <span class="spinner" aria-hidden="true"></span>
              <span class="btn-text">إنشاء العقد التجريبي</span>
            </button>
            <button type="button" class="btn btn-good" id="payBtn" disabled>
              <span class="spinner" aria-hidden="true"></span>
              <span class="btn-text">دفع Pi Testnet</span>
            </button>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="publicDealUrl">رابط العرض</label>
            </div>
            <input id="publicDealUrl" readonly data-keep-readonly="true" class="readonly-view" placeholder="يظهر بعد إنشاء الصفقة" />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="shareText">نص المشاركة</label>
            </div>
            <textarea id="shareText" readonly data-keep-readonly="true" class="readonly-view" style="min-height:90px" placeholder="يظهر بعد إنشاء الصفقة"></textarea>
          </div>

          <div class="actions">
            <button type="button" class="btn btn-ghost" id="openShareBtn" disabled>فتح العرض</button>
            <button type="button" class="btn btn-ghost" id="copyShareBtn" disabled>نسخ المشاركة</button>
            <button type="button" class="btn btn-ghost" id="nativeShareBtn" disabled>مشاركة</button>
          </div>
        </div>
      </section>

      <aside class="card" aria-label="حالة الصفقة">
        <div class="card-header">
          <div>
            <h2>حالة الصفقة</h2>
          </div>
          <button type="button" class="btn btn-ghost" id="healthBtn">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-text">فحص الباكند</span>
          </button>
        </div>

        <div class="card-body">
          <div class="status-list">
            <div class="status-line"><span class="key">Backend</span><span class="value" id="backendUrlView">-</span></div>
            <div class="status-line"><span class="key">Deal ID</span><span class="value" id="dealView">-</span></div>
            <div class="status-line"><span class="key">Amount</span><span class="value" id="amountView">-</span></div>
            <div class="status-line"><span class="key">Payment ID</span><span class="value" id="paymentView">-</span></div>
            <div class="status-line"><span class="key">TXID</span><span class="value" id="txView">-</span></div>
            <div class="status-line"><span class="key">Status</span><span class="value" id="statusView">-</span></div>
          </div>

          <div class="actions">
            <button type="button" class="btn btn-ghost" id="refreshDealBtn" disabled>قراءة الصفقة</button>
          </div>
        </div>
      </aside>
    </section>

    <div class="internal">
      <span id="piSdkView"></span>
      <span id="userView"></span>
      <span id="piUidView"></span>
      <span id="appIdView"></span>
      <div id="resultBox"></div>
      <div id="logBox"></div>
      <div id="debugBox"></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <p class="footer">
      <a href="terms.html">Terms</a> ·
      <a href="privacy.html">Privacy</a> ·
      Cortex Escrow · Pi Testnet
    </p>
  </main>

  <script>
    'use strict';

    const CONFIG = Object.freeze({
      APP_NAME: 'Cortex Escrow',
      VERSION: '13.0.1.3',
      APP_ID: '24f0d30e-9254-4936-9425-751c825c4aea',
      NETWORK: 'PI_TESTNET',
      BACKEND_URL: 'https://pi-backend-kv9g.onrender.com',
      SDK_VERSION: '2.0',
      SANDBOX: true,
      CURRENCY: 'Pi',
      PI_DECIMALS: 7,
      MIN_AMOUNT: 0.0000001,
      MAX_AMOUNT: 100000,
      REQUEST_TIMEOUT_MS: 22000
    });

    
const PI_AUTH_SCOPES = Object.freeze(['username', 'payments']);
    const state = {
      piInitialized: false,
      auth: null,
      accessToken: null,
      piUser: null,
      username: '',
      userUid: '',
      userLabel: '',
      currentDeal: null,
      dealId: null,
      paymentId: null,
      txid: null,
      share: null,
      backendOnline: false,
      paymentBusy: false,
      authPromise: null,
      lastResult: null
    };

    const $ = (id) => document.getElementById(id);
    const ui = {};

    function collectUi() {
      const ids = [
        'mainGrid','createBtn','payBtn','healthBtn','refreshDealBtn',
        'backendBadge','networkBadge','backendUrlView','dealView','amountView','paymentView','txView','statusView',
        'description','dealTerms','amount','dealType','publicDealUrl','shareText','openShareBtn','copyShareBtn','nativeShareBtn',
        'piSdkView','userView','piUidView','appIdView','resultBox','logBox','debugBox','toast'
      ];
      for (const id of ids) ui[id] = $(id);
      return ids.every((id) => Boolean(ui[id]));
    }

    function cleanText(value, maxLength) {
      return String(value ?? '').replace(/\s+/g, ' ').trim().slice(0, maxLength);
    }

    function showToast(message, type) {
      if (!ui.toast || !message) return;
      ui.toast.className = 'toast show';
      if (type) ui.toast.classList.add(type);
      ui.toast.textContent = message;
      clearTimeout(showToast.timer);
      const delay = type === 'err' ? 15000 : 3200;
      showToast.timer = setTimeout(() => {
        ui.toast.className = 'toast';
        ui.toast.textContent = '';
      }, delay);
    }

    function setResult(message, type) {
      state.lastResult = message || '';
      if (ui.resultBox) ui.resultBox.textContent = message || '';
      if (message && type === 'err') showToast(message, type);
    }

    function addLog(message, data) {
      state.lastResult = data || message || state.lastResult;
    }

    function showDiagnostics(phase, error) {
      state.lastResult = { phase: String(phase || ''), error: error ? String(error.message || error) : '' };
      return state.lastResult;
    }

    function showDebug(message, error) {
      state.lastResult = { message: String(message || ''), error: error ? String(error.message || error) : '' };
    }

    function hideDebug() {}

    function setBadge(type, text) {
      ui.backendBadge.className = 'badge';
      if (type) ui.backendBadge.classList.add(type);
      ui.backendBadge.textContent = text;
    }

    function setButtonText(button, text) {
      const span = button ? button.querySelector('.btn-text') : null;
      if (span) span.textContent = text;
      else if (button) button.textContent = text;
    }

    function setBusy(button, busy, text) {
      if (!button) return;
      button.disabled = Boolean(busy);
      button.classList.toggle('busy', Boolean(busy));
      if (text) setButtonText(button, text);
    }

    function getNested(source, paths) {
      if (!source || typeof source !== 'object') return null;
      for (const path of paths) {
        const parts = String(path).split('.');
        let current = source;
        let found = true;
        for (const part of parts) {
          if (current && Object.prototype.hasOwnProperty.call(current, part)) current = current[part];
          else { found = false; break; }
        }
        if (found && current !== undefined && current !== null && current !== '') return current;
      }
      return null;
    }

    function extractDealId(data) {
      return getNested(data, ['dealId','contractId','id','data.dealId','data.contractId','escrow.dealId','escrow.contractId','deal.dealId','deal.contractId']);
    }

    function extractPaymentId(payment) {
      return getNested(payment, ['identifier','paymentId','id','data.identifier','data.paymentId']);
    }

    function extractTxid(payment) {
      return getNested(payment, ['transaction.txid','txid','transaction.hash','data.transaction.txid','data.txid']);
    }

    function extractAccessToken(auth) {
      return getNested(auth, ['accessToken','access_token','token','data.accessToken']);
    }

    function extractUsername(auth) {
      return getNested(auth, ['user.username','username','data.user.username','data.username']);
    }

    function extractUserUid(auth) {
      return getNested(auth, ['user.uid','uid','data.user.uid','data.uid','user.id','id','data.user.id']);
    }

    function extractPiUser(auth) {
      return getNested(auth, ['user','data.user']) || null;
    }

    function makePiAccountLabel(username, uid) {
      const name = cleanText(username || '', 80);
      const id = cleanText(uid || '', 120);
      if (name && id) return `${name} · ${id}`;
      if (name) return name;
      if (id) return id;
      return '';
    }

    function extractUserLabel(auth) {
      return makePiAccountLabel(extractUsername(auth), extractUserUid(auth));
    }

    function normalizeArabicDigits(value) {
      const arabic = '٠١٢٣٤٥٦٧٨٩';
      const persian = '۰۱۲۳۴۵۶۷۸۹';
      return String(value ?? '').replace(/[٠-٩]/g, d => String(arabic.indexOf(d))).replace(/[۰-۹]/g, d => String(persian.indexOf(d)));
    }

    function normalizeAmountText(value) {
      return normalizeArabicDigits(value).trim().replace(',', '.');
    }

    function validateAmount() {
      const raw = normalizeAmountText(ui.amount.value);
      if (!raw) return { ok: false, message: 'أدخل السعر بعملة Pi.' };
      if (!/^(?:\d+)(?:\.\d{1,7})?$/.test(raw)) {
        return { ok: false, message: 'السعر يجب أن يكون رقماً صحيحاً أو عشرياً بحد أقصى 7 أرقام بعد الفاصلة.' };
      }
      const amount = Number(raw);
      if (!Number.isFinite(amount)) return { ok: false, message: 'السعر غير صالح.' };
      if (amount < CONFIG.MIN_AMOUNT) return { ok: false, message: 'أقل سعر مسموح هو 0.0000001 Pi.' };
      if (amount > CONFIG.MAX_AMOUNT) return { ok: false, message: 'أعلى سعر مسموح هو 100000 Pi.' };
      return { ok: true, amount, amountText: raw };
    }

    function buildDealTitle(description, dealType) {
      const typeLabel = ({ service: 'خدمة', digital: 'منتج رقمي', physical: 'منتج مادي', other: 'صفقة' })[dealType] || 'صفقة';
      const shortDescription = cleanText(description, 64);
      return shortDescription ? `${typeLabel}: ${shortDescription}`.slice(0, 120) : 'Cortex Escrow Deal';
    }

    function savePiUserLabel(label) {
      try {
        if (label) localStorage.setItem('cortex_escrow_pi_user_label', String(label));
      } catch (_) {}
    }

    function savePiProfile() {
      try {
        const profile = {
          label: state.userLabel || '',
          username: state.username || '',
          uid: state.userUid || '',
          savedAt: new Date().toISOString()
        };
        localStorage.setItem('cortex_escrow_pi_profile', JSON.stringify(profile));
        if (profile.label) localStorage.setItem('cortex_escrow_pi_user_label', profile.label);
      } catch (_) {}
    }

    function loadSavedPiProfile() {
      try {
        const raw = localStorage.getItem('cortex_escrow_pi_profile');
        if (!raw) {
          const oldLabel = localStorage.getItem('cortex_escrow_pi_user_label') || '';
          return oldLabel ? { label: oldLabel, username: '', uid: '' } : null;
        }
        const profile = JSON.parse(raw);
        if (!profile || typeof profile !== 'object') return null;
        return {
          label: profile.label || '',
          username: profile.username || '',
          uid: profile.uid || ''
        };
      } catch (_) {
        return null;
      }
    }

    function loadSavedPiUserLabel() {
      const profile = loadSavedPiProfile();
      return profile ? (profile.label || '') : '';
    }

    function getPiAuthPayload() {
      const payload = {};
      if (state.accessToken) {
        payload.accessToken = state.accessToken;
        payload.piAccessToken = state.accessToken;
      }
      if (state.username) {
        payload.username = state.username;
        payload.piUsername = state.username;
        payload.creatorUsername = state.username;
        payload.buyerUsername = state.username;
      }
      if (state.userUid) {
        payload.uid = state.userUid;
        payload.piUserUid = state.userUid;
        payload.userUid = state.userUid;
        payload.creatorUid = state.userUid;
        payload.buyerUid = state.userUid;
      }
      if (state.userLabel) {
        payload.piUser = state.userLabel;
        payload.buyer = state.userLabel;
        payload.seller = state.userLabel;
      }
      if (state.piUser) payload.authUser = state.piUser;
      return payload;
    }

    function readDealForm() {
      const description = ui.description.value.trim();
      const terms = ui.dealTerms.value.trim();
      const dealType = ui.dealType.value || 'service';
      const amount = validateAmount();

      if (!description) return { ok: false, message: 'وصف الصفقة مطلوب.' };
      if (!amount.ok) return { ok: false, message: amount.message };

      const fullDescription = terms
        ? `وصف الصفقة:\n${description}\n\nشروط الصفقة إن وجدت:\n${terms}`
        : description;

      return {
        ok: true,
        payload: {
          title: buildDealTitle(description, dealType),
          dealType,
          description: fullDescription,
          dealTerms: terms,
          terms,
          amount: amount.amountText,
          currency: CONFIG.CURRENCY,
          network: CONFIG.NETWORK,
          source: 'cortex_escrow_v13_stage1_clean_from_8_8',
          ...getPiAuthPayload()
        }
      };
    }

    function updateUiFromDeal(deal) {
      if (!deal) return;
      state.currentDeal = deal;
      state.dealId = deal.dealId || deal.contractId || state.dealId;
      state.paymentId = deal.paymentId || state.paymentId;
      state.txid = deal.txid || state.txid;
      ui.dealView.textContent = state.dealId || '-';
      ui.amountView.textContent = deal.amount ? `${deal.amount} Pi` : '-';
      ui.paymentView.textContent = state.paymentId || '-';
      ui.txView.textContent = state.txid || '-';
      ui.statusView.textContent = deal.status || '-';
      refreshButtons();
    }

    function refreshButtons() {
      const hasDeal = Boolean(state.dealId);
      ui.payBtn.disabled = !hasDeal || state.paymentBusy;
      ui.refreshDealBtn.disabled = !hasDeal;
      const hasShare = Boolean(state.share && (state.share.publicUrl || state.share.url));
      ui.openShareBtn.disabled = !hasShare;
      ui.copyShareBtn.disabled = !hasShare;
      ui.nativeShareBtn.disabled = !hasShare;
    }

    async function waitForPiSdk(timeoutMs = 7000) {
      const started = Date.now();
      while (Date.now() - started < timeoutMs) {
        if (window.Pi && typeof window.Pi.init === 'function') return true;
        await new Promise(resolve => setTimeout(resolve, 150));
      }
      return false;
    }

    async function ensurePiSdk(showMessage = true) {
      if (state.piInitialized) return true;
      const available = await waitForPiSdk();
      if (!available) {
        ui.piSdkView.textContent = 'غير متوفر';
        if (showMessage) setResult('لم يتم العثور على Pi SDK. افتح الرابط من Pi Browser وتأكد أن sdk.minepi.com يعمل.', 'err');
        return false;
      }
      try {
        await Promise.resolve(window.Pi.init({ version: CONFIG.SDK_VERSION, sandbox: CONFIG.SANDBOX }));
        state.piInitialized = true;
        ui.piSdkView.textContent = 'مهيأ';
        showDiagnostics('pi_init_success');
        addLog('تمت تهيئة Pi SDK.', { version: CONFIG.SDK_VERSION, sandbox: CONFIG.SANDBOX });
        return true;
      } catch (error) {
        const message = error && error.message ? error.message : String(error);
        if (/already|init/i.test(message)) {
          state.piInitialized = true;
          ui.piSdkView.textContent = 'مهيأ';
          showDiagnostics('pi_init_already_ready');
          addLog('Pi SDK كان مهيأ مسبقاً وتم اعتماد الجلسة الحالية.', { version: CONFIG.SDK_VERSION, sandbox: CONFIG.SANDBOX });
          return true;
        }
        ui.piSdkView.textContent = 'خطأ';
        setResult('فشل تهيئة Pi SDK: ' + message, 'err');
        showDebug('Pi init error', error);
        return false;
      }
    }

    async function ensurePiAuth() {
      if (state.auth) return state.auth;
      if (state.authPromise) return state.authPromise;

      state.authPromise = (async () => {
        const ready = await ensurePiSdk(true);
        if (!ready) throw new Error('Pi SDK غير جاهز.');
        if (!window.Pi || typeof window.Pi.authenticate !== 'function') {
          throw new Error('Pi.authenticate غير متوفر. افتح التطبيق من Pi Browser.');
        }

        setResult('سيظهر Pi Allow الرسمي الآن.', 'warn');
        showDiagnostics('before_pi_authenticate');
        const auth = await window.Pi.authenticate(PI_AUTH_SCOPES, onIncompletePaymentFound);

        state.auth = auth;
        state.accessToken = extractAccessToken(auth);
        state.piUser = extractPiUser(auth);
        state.username = extractUsername(auth) || '';
        state.userUid = extractUserUid(auth) || '';
        state.userLabel = extractUserLabel(auth);
        ui.userView.textContent = state.userLabel;
        ui.piUidView.textContent = state.userUid || '-';
        savePiProfile();
        hideDebug();
        showDiagnostics('pi_auth_success');

        addLog('تم ربط حساب Pi بنجاح عند الدخول.', {
          user: state.userLabel,
          username: state.username || '-',
          uid: state.userUid || '-',
          scopes: PI_AUTH_SCOPES
        });

        return auth;
      })();

      try {
        return await state.authPromise;
      } finally {
        state.authPromise = null;
      }
    }

    async function autoConnectPiAllowOnEntry() {
      if (state.auth) return;
      try {
        setResult('يتم الآن فتح لوحة Pi Allow الرسمية تلقائياً.', 'warn');
        await ensurePiAuth();
        setResult('تم ربط Pi Allow تلقائياً. يمكنك إنشاء الصفقة ثم الضغط على دفع Pi Testnet.', 'ok');
      } catch (error) {

        if (saved && saved.label) {
          state.username = saved.username || state.username || '';
          state.userUid = saved.uid || state.userUid || '';
          state.userLabel = saved.label || state.userLabel || '';
          ui.userView.textContent = saved.label + ' · جلسة محفوظة';
          ui.piUidView.textContent = state.userUid || '-';
        }
        setResult('لم تكتمل موافقة Pi Allow: ' + (error.message || error), 'err');
        addLog('Pi Allow التلقائي لم يكتمل.', { message: error.message || String(error) });
        showDiagnostics('auto_pi_allow_not_completed', error);
      }
    }

    async function apiFetch(path, options = {}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), CONFIG.REQUEST_TIMEOUT_MS);
      const headers = Object.assign({ 'Content-Type': 'application/json', Accept: 'application/json' }, options.headers || {});
      let body = options.body;

      if (body !== undefined && body !== null && typeof body !== 'string') {
        body = JSON.stringify(body);
      }

      try {
        const response = await fetch(CONFIG.BACKEND_URL.replace(/\/+$/, '') + path, {
          method: options.method || 'GET',
          headers,
          body,
          signal: controller.signal,
          cache: 'no-store'
        });

        const contentType = response.headers.get('content-type') || '';
        const data = contentType.includes('application/json')
          ? await response.json()
          : { raw: await response.text() };

        if (!response.ok || data.success === false || data.ok === false) {
          const error = new Error(data.message || data.error || data.raw || response.statusText || `HTTP ${response.status}`);
          error.status = response.status;
          error.data = data;
          error.details = data;
          throw error;
        }

        return data || { success: true };
      } catch (error) {
        if (error && error.name === 'AbortError') {
          const timeoutError = new Error('انتهت مهلة الاتصال بالباكند.');
          timeoutError.details = { path };
          throw timeoutError;
        }
        throw error;
      } finally {
        clearTimeout(timer);
      }
    }

    async function checkBackend() {
      hideDebug();
      setBadge('', 'Backend');
      setBusy(ui.healthBtn, true);
      try {
        const data = await apiFetch('/api/health');
        state.backendOnline = true;
        setBadge('ok', 'Backend OK');
        addLog('فحص الباكند ناجح.', data);
      } catch (error) {
        state.backendOnline = false;
        setBadge('err', 'Backend Error');
        setResult('فشل فحص الباكند: ' + (error.message || error), 'err');
        addLog('فشل فحص الباكند.', error.data || { message: error.message || String(error) });
      } finally {
        setBusy(ui.healthBtn, false, 'فحص الباكند');
      }
    }

    async function createDeal() {
      hideDebug();
      setBusy(ui.createBtn, true, 'جاري إنشاء العقد...');

      try {
        const form = readDealForm();
        if (!form.ok) throw new Error(form.message);

        if (!state.backendOnline) {
          await checkBackend().catch(() => null);
        }

        const created = await apiFetch('/api/escrow/create', { method: 'POST', body: form.payload });
        const dealId = extractDealId(created);
        if (!dealId) throw new Error('تم إنشاء الطلب لكن لم يرجع الباكند Deal ID واضح.');

        const createdDeal = created.deal || created.escrow || created.data || created;
        state.currentDeal = {
          ...createdDeal,
          dealId,
          contractId: createdDeal.contractId || dealId,
          title: createdDeal.title || form.payload.title,
          description: createdDeal.description || form.payload.description,
          dealTerms: createdDeal.dealTerms || form.payload.dealTerms,
          amount: createdDeal.amount || form.payload.amount,
          currency: CONFIG.CURRENCY,
          dealType: createdDeal.dealType || form.payload.dealType
        };

        state.dealId = dealId;
        ui.dealView.textContent = dealId;
        ui.amountView.textContent = `${form.payload.amount} Pi`;
        ui.statusView.textContent = getNested(created, ['status','deal.status','data.status']) || 'CREATED';

        setResult('تم إنشاء صفقة الضمان.', 'ok');
        addLog('تم إنشاء الصفقة.', created);

        await readDeal(dealId, false).catch(() => null);
        await loadShareKit().catch(() => null);
        refreshButtons();

        return state.currentDeal;
      } catch (error) {
        setResult('فشل إنشاء الصفقة: ' + (error.message || error), 'err');
        addLog('فشل إنشاء الصفقة.', error.data || { message: error.message || String(error) });
        return null;
      } finally {
        setBusy(ui.createBtn, false, 'إنشاء العقد التجريبي');
        refreshButtons();
      }
    }

    async function readDeal(id = state.dealId, showOk = true) {
      if (!id) throw new Error('لا يوجد Deal ID.');
      const data = await apiFetch('/api/escrow/' + encodeURIComponent(id));
      const deal = data.deal || data.escrow || data.data || data;
      updateUiFromDeal(deal);
      if (showOk) setResult('تم تحديث بيانات الصفقة.', 'ok');
      addLog('بيانات الصفقة الحالية.', data);
      return deal;
    }

    function makePaymentData() {
      const deal = state.currentDeal || {};
      const amount = Number(deal.amount || normalizeAmountText(ui.amount.value));
      if (!Number.isFinite(amount) || amount <= 0) throw new Error('مبلغ الصفقة غير صحيح.');
      const dealId = deal.dealId || deal.contractId || state.dealId;
      if (!dealId) throw new Error('أنشئ الصفقة أولاً.');
      const dealType = deal.dealType || ui.dealType.value || 'service';
      const memoType = ({ service: 'Service', digital: 'Digital', physical: 'Physical', other: 'Deal' })[dealType] || 'Deal';
      const description = deal.description || readDealForm().payload.description;
      return {
        amount,
        memo: `Cortex Escrow Deal - ${memoType}`,
        metadata: {
          type: 'escrow_deal_payment',
          app: CONFIG.APP_NAME,
          version: CONFIG.VERSION,
          dealId,
          contractId: deal.contractId || dealId,
          title: deal.title || buildDealTitle(description, dealType),
          dealType,
          description,
          dealTerms: deal.dealTerms || ui.dealTerms.value.trim() || '',
          amount: deal.amount || normalizeAmountText(ui.amount.value),
          currency: CONFIG.CURRENCY,
          createdAt: deal.createdAt || new Date().toISOString(),
          ...getPiAuthPayload()
        }
      };
    }

    async function startPiPayment() {
      if (state.paymentBusy) return;
      hideDebug();
      state.paymentBusy = true;
      setBusy(ui.payBtn, true, 'جاري فتح Pi Wallet...');

      try {
        if (!state.dealId) throw new Error('أنشئ الصفقة أولاً ثم ادفع.');

        if (!window.Pi || typeof window.Pi.createPayment !== 'function') {
          throw new Error('Pi.createPayment غير متوفر. افتح التطبيق من Pi Browser.');
        }

        if (!state.currentDeal) await readDeal(state.dealId, false).catch(() => null);

        const paymentData = makePaymentData();
        const dealId = paymentData.metadata.dealId;
        setResult('يتم فتح واجهة Pi Wallet الآن.', 'warn');

        const result = window.Pi.createPayment(paymentData, {
          onReadyForServerApproval: async function(paymentId) {
            try {
              state.paymentId = paymentId;
              ui.paymentView.textContent = paymentId;

              const approved = await apiFetch('/api/pi/approve', {
                method: 'POST',
                body: {
                  paymentId,
                  dealId,
                  contractId: dealId,
                  network: CONFIG.NETWORK,
                  appId: CONFIG.APP_ID,
                  ...getPiAuthPayload()
                }
              });

              setResult('وافق الباكند على الدفع.', 'ok');
              addLog('تمت موافقة الباكند على الدفع.', approved);
              await readDeal(state.dealId, false).catch(() => null);
            } catch (error) {
              setResult('فشل اعتماد الدفع في الباكند: ' + (error.message || error), 'err');
              addLog('فشل اعتماد الدفع في الباكند.', error.data || { message: error.message || String(error) });
            }
          },

          onReadyForServerCompletion: async function(paymentId, txid) {
            try {
              state.paymentId = paymentId;
              state.txid = txid;
              ui.paymentView.textContent = paymentId;
              ui.txView.textContent = txid;

              const completed = await apiFetch('/api/pi/complete', {
                method: 'POST',
                body: {
                  paymentId,
                  txid,
                  dealId,
                  contractId: dealId,
                  network: CONFIG.NETWORK,
                  appId: CONFIG.APP_ID,
                  ...getPiAuthPayload()
                }
              });

              setResult('اكتمل دفع Pi Testnet.', 'ok');
              addLog('اكتمل الدفع عبر الباكند.', completed);
              await readDeal(state.dealId, false).catch(() => null);
            } catch (error) {
              setResult('فشل إكمال الدفع في الباكند: ' + (error.message || error), 'err');
              addLog('فشل إكمال الدفع في الباكند.', error.data || { message: error.message || String(error) });
            }
          },

          onCancel: async function(paymentId) {
            state.paymentId = paymentId || state.paymentId;
            if (state.paymentId) ui.paymentView.textContent = state.paymentId;

            try {
              const cancelled = await apiFetch('/api/pi/cancel', {
                method: 'POST',
                body: {
                  paymentId: state.paymentId,
                  dealId,
                  contractId: dealId,
                  network: CONFIG.NETWORK,
                  appId: CONFIG.APP_ID,
                  ...getPiAuthPayload()
                }
              });
              setResult('تم إلغاء الدفع.', 'warn');
              addLog('تم إلغاء الدفع.', cancelled);
            } catch (error) {
              setResult('تم إلغاء الدفع.', 'warn');
              addLog('تعذر تسجيل إلغاء الدفع.', error.data || { message: error.message || String(error) });
            }
          },

          onError: function(error, payment) {
            const message = error && error.message ? error.message : String(error);
            setResult('حدث خطأ في Pi Wallet: ' + message, 'err');
            addLog('خطأ في Pi Wallet.', { message, payment });
          }
        });

        if (result && typeof result.then === 'function') await result;
      } catch (error) {
        setResult('فشل بدء دفع Pi: ' + (error.message || error), 'err');
        addLog('فشل بدء الدفع.', error.data || { message: error.message || String(error) });
      } finally {
        state.paymentBusy = false;
        setBusy(ui.payBtn, false, 'دفع Pi Testnet');
        refreshButtons();
      }
    }

    async function onIncompletePaymentFound(payment) {
      const paymentId = extractPaymentId(payment);
      const txid = extractTxid(payment);
      const dealId = getNested(payment, ['metadata.dealId','metadata.contractId','data.metadata.dealId']) || state.dealId;

      if (paymentId) { state.paymentId = paymentId; ui.paymentView.textContent = paymentId; }
      if (txid) { state.txid = txid; ui.txView.textContent = txid; }

      addLog('تم العثور على دفعة Pi غير مكتملة.', { paymentId: paymentId || '-', txid: txid || '-', dealId: dealId || '-' });

      if (paymentId && txid) {
        try {
          const completed = await apiFetch('/api/pi/complete', {
            method: 'POST',
            body: { paymentId, txid, dealId, contractId: dealId, network: CONFIG.NETWORK, appId: CONFIG.APP_ID, source: 'incomplete_payment', ...getPiAuthPayload() }
          });
          setResult('تم إرسال الدفعة غير المكتملة للباكند لإكمالها.', 'ok');
          addLog('اكتملت معالجة الدفعة غير المكتملة.', completed);
          if (dealId) await readDeal(dealId, false);
        } catch (error) {
          setResult('توجد دفعة غير مكتملة ولم ينجح إكمالها تلقائياً: ' + (error.message || error), 'warn');
          addLog('فشل إكمال الدفعة غير المكتملة.', error.data || { message: error.message || String(error) });
        }
      }
    }

    async function loadShareKit() {
      if (!state.dealId) return null;
      const data = await apiFetch('/api/social/share/' + encodeURIComponent(state.dealId));
      const share = data.share || data.data || data;
      state.share = share;
      ui.publicDealUrl.value = share.publicUrl || share.url || '';
      ui.shareText.value = share.text || share.message || '';
      refreshButtons();
      addLog('تم تحميل بيانات المشاركة.', share);
      return share;
    }

    async function ensureShareKit() {
      if (!state.share && state.dealId) await loadShareKit();
      if (!state.share) throw new Error('لا توجد بيانات مشاركة متاحة.');
      return state.share;
    }

    async function openSharePage() {
      const share = await ensureShareKit();
      const url = share.publicUrl || share.url;
      if (!url) throw new Error('رابط العرض غير موجود.');
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    async function copyShareText() {
      const share = await ensureShareKit();
      const text = `${share.text || ''}\n${share.publicUrl || share.url || ''}`.trim();
      await navigator.clipboard.writeText(text);
      setResult('تم نسخ نص المشاركة.', 'ok');
    }

    async function nativeShare() {
      const share = await ensureShareKit();
      const url = share.publicUrl || share.url || '';
      const text = share.text || '';
      if (navigator.share) {
        await navigator.share({ title: share.title || 'Cortex Escrow Deal', text, url });
      } else {
        await navigator.clipboard.writeText(`${text}\n${url}`.trim());
        setResult('تم نسخ نص المشاركة.', 'ok');
      }
    }

    function installAmountGuard() {
      ui.amount.addEventListener('input', function() {
        const original = ui.amount.value;
        const normalized = normalizeAmountText(original);
        let cleaned = normalized.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');
        const parts = cleaned.split('.');
        if (parts.length > 1) cleaned = (parts[0] || '0') + '.' + parts[1].slice(0, CONFIG.PI_DECIMALS);
        if (cleaned !== original) ui.amount.value = cleaned;
      });
    }

    function installInputFocusFixes() {
      const controls = document.querySelectorAll('input, textarea, select');
      controls.forEach((el) => {
        const keepReadonly = el.dataset.keepReadonly === 'true' || el.hasAttribute('readonly');
        if (!keepReadonly) el.removeAttribute('readonly');
        el.tabIndex = el.tabIndex < 0 ? 0 : el.tabIndex;
        el.addEventListener('touchend', () => {
          if (document.activeElement !== el && typeof el.focus === 'function') {
            setTimeout(() => el.focus({ preventScroll: true }), 0);
          }
        }, { passive: true });
        el.addEventListener('click', () => {
          if (document.activeElement !== el && typeof el.focus === 'function') el.focus();
        });
      });
    }

    function bindButton(button, handler) {
      button.addEventListener('click', async () => {
        try { await handler(); }
        catch (error) {
          setResult('خطأ: ' + (error.message || error), 'err');
          addLog('خطأ.', error.data || { message: error.message || String(error) });
        } finally { refreshButtons(); }
      });
    }

    function installGlobalErrorHandlers() {
      window.addEventListener('error', function(event) {
        const message = event.message || 'JavaScript error';
        if (ui && ui.toast) setResult('خطأ في الواجهة: ' + message, 'err');
      });

      window.addEventListener('unhandledrejection', function(event) {
        const reason = event.reason || 'Unhandled promise rejection';
        const message = reason.message || String(reason);
        if (ui && ui.toast) setResult('خطأ غير متوقع: ' + message, 'err');
      });
    }

    async function boot() {
      installGlobalErrorHandlers();

      if (!collectUi()) {
        console.error('Missing UI elements');
        return;
      }

      const savedProfile = loadSavedPiProfile();
      const savedUser = savedProfile ? (savedProfile.label || '') : '';

      ui.backendUrlView.textContent = CONFIG.BACKEND_URL;
      ui.appIdView.textContent = CONFIG.APP_ID;
      ui.networkBadge.textContent = CONFIG.NETWORK === 'PI_TESTNET' ? 'TESTNET' : CONFIG.NETWORK;
      showDiagnostics('boot_after_ui_ready');
      if (savedProfile) {
        state.username = savedProfile.username || '';
        state.userUid = savedProfile.uid || '';
        state.userLabel = savedProfile.label || savedUser || '';
        if (state.userLabel) ui.userView.textContent = state.userLabel + ' · محفوظ';
        ui.piUidView.textContent = state.userUid || '-';
      }

      installAmountGuard();
      installInputFocusFixes();

      bindButton(ui.createBtn, createDeal);
      bindButton(ui.payBtn, startPiPayment);
      bindButton(ui.healthBtn, checkBackend);
      bindButton(ui.refreshDealBtn, () => readDeal());
      bindButton(ui.openShareBtn, openSharePage);
      bindButton(ui.copyShareBtn, copyShareText);
      bindButton(ui.nativeShareBtn, nativeShare);

      addLog('تم تحميل Cortex Escrow V13.0 Stage 1.3 Payments Only.');
      refreshButtons();

      const sdkReady = await ensurePiSdk(false).catch((error) => { showDebug('Pi SDK boot error', error); return false; });
      showDiagnostics(sdkReady ? 'sdk_ready_before_auto_allow' : 'sdk_not_ready_before_auto_allow');
      checkBackend().catch(() => null);

      if (sdkReady) {
        setTimeout(() => {
          autoConnectPiAllowOnEntry().catch(() => null);
        }, 450);
      } else {
        setResult('افتح التطبيق من Pi Browser حتى يتم تحميل Pi SDK وظهور لوحة Allow.', 'warn');
      }
    }

    document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
