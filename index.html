<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://sdk.minepi.com https://cdnjs.cloudflare.com; script-src 'self' 'nonce-cortex101' https://sdk.minepi.com https://cdnjs.cloudflare.com; connect-src 'self' https://pi-backend-kv9g.onrender.com https://api.minepi.com;">
    <title>Cortex Escrow V.10.1</title>
    <script nonce="cortex101" src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script nonce="cortex101" src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
    <style nonce="cortex101">
        body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f0f23;color:#fff;margin:0;padding:20px}
     .container{background:#1a1a2e;padding:25px;border-radius:15px;max-width:600px;margin:0 auto}
     .btn{background:linear-gradient(45deg,#6c5ce7,#a29bfe);color:white;border:none;padding:12px 20px;border-radius:8px;font-size:14px;cursor:pointer;width:100%;margin:8px 0}
     .btn:disabled{opacity:.5;cursor:not-allowed}
        input,select,textarea{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:1px solid #333;background:#16213e;color:#fff;box-sizing:border-box}
     .status{padding:10px;border-radius:6px;margin:10px 0;font-size:13px}
     .ok{background:#1a4d2e;color:#4ade80}
     .err{background:#4c1d1d;color:#f87171}
     .warn{background:#4a3c1a;color:#fbbf24}
     .ai{background:#1e3a5f;color:#60a5fa}
     .hidden{display:none}
     .user-info{background:#16213e;padding:12px;border-radius:8px;margin:15px 0;font-size:13px}
        #feeCalc{font-size:12px;color:#a0a0a0;margin:5px 0}
        #quantumLink{word-break:break-all;background:#0f0f23;padding:10px;border-radius:6px;font-size:12px}
        label{font-size:13px;color:#a0a0a0;display:block;margin-top:10px}
    </style>
</head>
<body>
    <div class="container">
        <div id="loginBox">
            <h2>Cortex Escrow V.10.1</h2>
            <p>منصة الضمان الذكي على شبكة Pi - Testnet</p>
            <button class="btn" id="loginBtn">🔐 تسجيل الدخول بحساب Pi</button>
        </div>
        <div id="appBox" class="hidden">
            <h3>محكمة العقود الذكية</h3>
            <div id="userInfo" class="user-info"></div>

            <label>نوع الصفقة</label>
            <select id="dealType">
                <option value="digital">منتج رقمي</option>
                <option value="service">خدمة</option>
                <option value="physical">منتج مادي</option>
            </select>

            <label>تفاصيل الصفقة</label>
            <textarea id="textInput" rows="3" placeholder="اكتب وصف دقيق للمنتج أو الخدمة..."></textarea>

            <label>السعر بـ Pi</label>
            <input type="text" id="textInputPrice" placeholder="مثال: 10.5">
            <div id="feeCalc">أدخل السعر لحساب العمولة</div>

            <label>محفظة البائع للاستلام - Testnet</label>
            <input type="text" id="sellerWalletInput" placeholder="الصق عنوان محفظة Testnet هنا">

            <button class="btn" id="deployBtn">📝 إنشاء العقد الذكي</button>
            <button id="depositBtn" class="btn hidden">💰 إيداع Test-Pi</button>
            <button id="releaseBtn" class="btn hidden">🔓 تحرير الدفع</button>
            <button class="btn" id="newDealBtn">🔄 صفقة جديدة</button>

            <div id="status"></div>
            <div id="contractHash" style="font-size:11px;color:#666;margin:10px 0"></div>
            <div id="quantumLink" class="hidden"></div>
            <button id="copyLinkBtn" class="btn hidden">📋 نسخ رابط العقد</button>
        </div>
    </div>

<script nonce="cortex101">
const GENESIS_API = 'https://pi-backend-kv9g.onrender.com';
const ESCROW_ADDRESS = "GANJOECQGTUJQRYDCNSV5NODXXEDJ273RPWA3ZVPOQQ252ZLXRY4LLM3";
let currentUser = null;
let activeContract = null;
let currentLink = '';

Pi.init({version:"2.0", sandbox:true});

const I18N = {ar:{login:"تسجيل الدخول بحساب Pi",loginFirst:"يجب تسجيل الدخول أولاً",loggedIn:"مسجل الدخول:"}};
function t(k){return I18N?.[k]||I18N['ar'][k]||k}

function showStatus(msg,type='warn'){
    const box=document.getElementById('status');
    box.innerHTML=`<div class="status ${type}">${msg}</div>`;
    if(type!=='err') setTimeout(()=>box.innerHTML='',8000);
}

function parsePiAmount(str){
    const r=/^\d+(\.\d{1,7})?$/;
    if(!r.test(str)) return null;
    const n=parseFloat(str);
    return n>=0.0000001&&n<=100000?n:null;
}

function calculateFees(price){
    const p=parseFloat(price);
    if(isNaN(p)||p<=0) return null;
    const sellerFee=Math.floor(p*0.01*10000000)/10000000;
    const buyerFee=Math.ceil(p*0.01*10000000)/10000000;
    const aiFee=Math.floor(p*0.001*10000000)/10000000;
    const platformFee=Math.floor((sellerFee+buyerFee-aiFee*3)*10000000)/10000000;
    return {
        price:p,
        sellerReceives:Math.floor((p-sellerFee)*10000000)/10000000,
        buyerPays:Math.ceil((p+buyerFee)*10000000)/10000000,
        sellerFee,buyerFee,platformFee,aiFee
    };
}

function onIncompletePaymentFound(payment){
    return Pi.completePayment(payment.identifier);
}

document.getElementById('loginBtn').addEventListener('click', async ()=>{
    try{
        showStatus('جاري الاتصال بـ Pi...','warn');
        const scopes=['username','payments'];
        const auth=await Pi.authenticate(scopes,onIncompletePaymentFound);
        currentUser=auth.user;
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('appBox').classList.remove('hidden');
        document.getElementById('userInfo').innerHTML=`${t('loggedIn')} <b>@${currentUser.username}</b><br><span style="font-size:10px">UID: ${currentUser.uid}</span><br><span style="color:#FFAA00">TESTNET</span>`;
        showStatus('✅ تم الاتصال بـ Pi Testnet','ok');
    }catch(e){
        showStatus('خطأ: '+e.message,'err');
    }
});

document.getElementById('deployBtn').addEventListener('click', async ()=>{
    if(!currentUser) return showStatus(t('loginFirst'),'err');
    const text=document.getElementById('textInput').value.trim();
    const price=parsePiAmount(document.getElementById('textInputPrice').value);
    const sellerWallet=document.getElementById('sellerWalletInput').value.trim();
    if(!text||price===null) return showStatus('اكتب تفاصيل + سعر صحيح','err');
    if(!sellerWallet||sellerWallet.length<56) return showStatus('أدخل عنوان محفظة Testnet صحيح للبائع','err');

    const dealType=document.getElementById('dealType').value;
    showStatus('محكمة AI تحلل الصفقة...','ai');

    try{
        const controller=new AbortController();
        const timeoutId=setTimeout(()=>controller.abort(),15000);

        const res=await fetch(`${GENESIS_API}/genesis/deploy`,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                text,price,dealType,
                seller:currentUser.uid,
                sellerWallet:sellerWallet,
                escrowAddress:ESCROW_ADDRESS,
                testnet:true
            }),
            signal:controller.signal
        });
        clearTimeout(timeoutId);

        if(!res.ok) throw new Error(`API Error: ${res.status}`);
        const data=await res.json();
        if(!data.success) return showStatus(`مرفوض: ${data.reason}`,'err');

        activeContract={...data,price,dealType,fees:calculateFees(price),sellerWallet};
        currentLink=`https://apuaish1976.github.io/?g=${data.contractId}&testnet=1`;

        document.getElementById('contractHash').textContent=`ContractID: ${data.hash}`;
        document.getElementById('quantumLink').textContent=currentLink;
        document.getElementById('quantumLink').classList.remove('hidden');
        document.getElementById('copyLinkBtn').classList.remove('hidden');
        document.getElementById('depositBtn').classList.remove('hidden');
        showStatus('✅ تم إنشاء العقد. الآن يمكن للمشتري الإيداع','ok');
    }catch(e){
        if(e.name==='AbortError') showStatus('انتهت مهلة الاتصال بالخادم','err');
        else showStatus('فشل إنشاء العقد: '+e.message,'err');
    }
});

document.getElementById('depositBtn').addEventListener('click', async ()=>{
    if(!currentUser) return showStatus(t('loginFirst'),'err');
    if(!activeContract) return showStatus('أنشئ صفقة أولاً','err');

    try{
        const fees=activeContract.fees;
        showStatus('افتح محفظة Pi للموافقة على الإيداع...','warn');

        const paymentData={
            amount:fees.buyerPays,
            memo:`Escrow:${activeContract.contractId}`,
            metadata:{contractId:activeContract.contractId,type:'escrow_deposit',escrow:ESCROW_ADDRESS}
        };

        await Pi.createPayment(paymentData,onIncompletePaymentFound);

        showStatus('✅ تم حجز Test-Pi في الضمان','ok');
        document.getElementById('depositBtn').classList.add('hidden');
        document.getElementById('releaseBtn').classList.remove('hidden');
    }catch(e){
        showStatus('فشل الإيداع: '+e.message,'err');
    }
});

document.getElementById('releaseBtn').addEventListener('click', async ()=>{
    if(!currentUser) return showStatus(t('loginFirst'),'err');
    if(!activeContract) return showStatus('لا توجد صفقة نشطة','err');

    try{
        showStatus('جاري طلب تحرير الدفع من الخادم...','warn');

        const res=await fetch(`${GENESIS_API}/genesis/release`,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                contractId:activeContract.contractId,
                buyer:currentUser.uid
            })
        });

        const data=await res.json();
        if(!data.success) throw new Error(data.reason);

        showStatus('✅ تم التوزيع: 99% للبائع + 1% للمنصة + 0.3% هدية AI','ok');
        document.getElementById('releaseBtn').classList.add('hidden');
    }catch(e){
        showStatus('فشل التحرير: '+e.message,'err');
    }
});

document.getElementById('newDealBtn').addEventListener('click', ()=>{
    document.getElementById('textInput').value='';
    document.getElementById('textInputPrice').value='';
    document.getElementById('sellerWalletInput').value='';
    document.getElementById('feeCalc').textContent='أدخل السعر لحساب العمولة';
    document.getElementById('status').innerHTML='';
    document.getElementById('contractHash').textContent='';
    document.getElementById('quantumLink').classList.add('hidden');
    document.getElementById('copyLinkBtn').classList.add('hidden');
    document.getElementById('depositBtn').classList.add('hidden');
    document.getElementById('releaseBtn').classList.add('hidden');
    activeContract=null;
    showStatus('✅ جاهز لإنشاء صفقة تجريبية جديدة','ok');
});

document.getElementById('copyLinkBtn').addEventListener('click', ()=>{
    navigator.clipboard.writeText(currentLink);
    showStatus('✅ تم نسخ الرابط','ok');
});

document.getElementById('textInputPrice').addEventListener('input',e=>{
    const fees=calculateFees(e.target.value);
    if(fees){
        document.getElementById('feeCalc').innerHTML=
        `البائع يستلم: ${fees.sellerReceives} Test-π | المشتري يدفع: ${fees.buyerPays} Test-π<br>`+
        `المنصة: ${fees.platformFee} π | هدية AI: ${(fees.aiFee*3).toFixed(7)} π`;
    }else{
        document.getElementById('feeCalc').textContent='أدخل السعر لحساب العمولة';
    }
});

window.onload=()=>{
    const params=new URLSearchParams(window.location.search);
    const g=params.get('g');
    if(g) showStatus('وضع المشتري: سجل دخول ثم اضغط إيداع','ai');
};
</script>
</body>
</html>
