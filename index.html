<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Escrow V.10.1</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f0f23;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .btn {
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .user-info {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: right;
        }
        .error {
            color: #ff6b6b;
            margin-top: 15px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- شاشة تسجيل الدخول -->
        <div id="login-screen">
            <h2>Cortex Escrow V.10.1</h2>
            <p>منصة الضمان الذكي على شبكة Pi</p>
            <button id="login-btn" class="btn">تسجيل الدخول بـ Pi</button>
            <div id="login-error" class="error"></div>
        </div>

        <!-- شاشة التطبيق بعد الدخول -->
        <div id="app-screen" class="hidden">
            <h2>مرحباً بك في Cortex Escrow</h2>
            <div class="user-info">
                <strong>المستخدم:</strong> <span id="username"></span><br>
                <strong>UID:</strong> <span id="uid"></span>
            </div>
            
            <!-- هنا حط كود V.10.1 الأصلي حقك -->
            <div id="v10-content">
                <p>تم تسجيل الدخول بنجاح. جاري تحميل العقود...</p>
                <!-- ضيف مكونات V.10.1 هنا -->
            </div>
            
            <button id="logout-btn" class="btn" style="background: #e74c3c; margin-top: 30px;">تسجيل الخروج</button>
        </div>
    </div>

    <script>
        // 1. تهيئة Pi SDK
        Pi.init({ version: "2.0", sandbox: true });

        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');
        const loginError = document.getElementById('login-error');

        // 2. فحص إذا المستخدم مسجل دخول مسبقاً
        function checkAuthStatus() {
            const authResult = Pi.getAuthResult();
            if (authResult) {
                showApp(authResult.user);
            }
        }

        // 3. تسجيل الدخول
        loginBtn.addEventListener('click', async () => {
            loginBtn.disabled = true;
            loginBtn.textContent = 'جاري التحقق...';
            loginError.textContent = '';

            try {
                const scopes = ['username', 'payments'];
                const authResult = await Pi.authenticate(scopes, onIncompletePaymentFound);
                showApp(authResult.user);
            } catch (err) {
                loginError.textContent = 'فشل تسجيل الدخول: ' + err.message;
                loginBtn.disabled = false;
                loginBtn.textContent = 'تسجيل الدخول بـ Pi';
            }
        });

        // 4. عرض التطبيق بعد الدخول
        function showApp(user) {
            document.getElementById('username').textContent = '@' + user.username;
            document.getElementById('uid').textContent = user.uid;
            
            loginScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');
            
            // هنا استدعي دوال V.10.1 حقتك
            initCortexV10(user);
        }

        // 5. تسجيل الخروج
        logoutBtn.addEventListener('click', () => {
            appScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            loginBtn.disabled = false;
            loginBtn.textContent = 'تسجيل الدخول بـ Pi';
        });

        // 6. معالجة الدفعات غير المكتملة
        function onIncompletePaymentFound(payment) {
            console.log('Found incomplete payment:', payment);
            // ضيف منطق معالجة الدفعات هنا لو تحتاجه
        }

        // 7. دالة تشغيل V.10.1 - ضيف كودك هنا
        function initCortexV10(user) {
            console.log('User logged in:', user);
            // مثال: تحميل العقود الخاصة بالمستخدم
            // loadUserContracts(user.uid);
            // ابدأ كود V.10.1 من هنا
        }

        // شغل الفحص عند تحميل الصفحة
        checkAuthStatus();
    </script>
</body>
</html>
