<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://sdk.minepi.com https://*.minepi.com; connect-src 'self' https://pi-backend-kv9g.onrender.com https://api.minepi.com https://*.minepi.com; img-src 'self' data: https://*.minepi.com; style-src 'self' 'unsafe-inline'; frame-src 'self' https://minepi.com https://*.minepi.com https://app-cdn.minepi.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
  <title>Cortex Escrow · Pi Testnet</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --bg2: #10101a;
      --card: rgba(20, 20, 30, .94);
      --accent: #7c6cff;
      --accent2: #22d3ee;
      --success: #00d084;
      --error: #ff4757;
      --warn: #ffa502;
      --text: #f1f2f6;
      --muted: #a4adba;
      --border: rgba(255,255,255,.12);
      --shadow: 0 18px 55px rgba(0,0,0,.35);
      --radius: 18px;
      --input-bg: rgba(255,255,255,.065);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(124,108,255,.22), transparent 34%),
        radial-gradient(circle at bottom left, rgba(34,211,238,.14), transparent 31%),
        linear-gradient(145deg, var(--bg), var(--bg2));
      color: var(--text);
      padding: 14px 14px calc(24px + var(--safe-bottom));
      line-height: 1.7;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 14px;
      background: var(--input-bg);
      color: var(--text);
      padding: 12px 13px;
      transition: .18s border-color, .18s box-shadow, .18s background;
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
      touch-action: auto;
      pointer-events: auto;
      caret-color: var(--accent2);
      min-height: 48px;
    }

    input::placeholder, textarea::placeholder { color: rgba(241,242,246,.48); }
    select option { background: #11111a; color: var(--text); }
    textarea { min-height: 112px; resize: vertical; }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(34,211,238,.58);
      box-shadow: 0 0 0 4px rgba(34,211,238,.10);
      background: rgba(255,255,255,.09);
    }

    .app { width: min(1080px, 100%); margin: 0 auto; display: grid; gap: 16px; }
    .hero {
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 8px);
      background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.035));
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: -120px auto auto -120px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(255,255,255,.15), transparent 62%);
      pointer-events: none;
    }
    .hero-inner { padding: 22px; display: grid; gap: 16px; position: relative; z-index: 1; }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), #4a3cff);
      box-shadow: 0 12px 35px rgba(124,108,255,.28);
      font-weight: 900;
      color: white;
    }
    h1 { font-size: clamp(1.55rem, 5vw, 2.55rem); line-height: 1.25; }
    h2 { font-size: 1.14rem; margin-bottom: 4px; }
    .subtitle, .muted { color: var(--muted); font-size: .91rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      border-radius: 999px;
      color: var(--text);
      font-size: .84rem;
      white-space: nowrap;
    }
    .badge.ok { border-color: rgba(0,208,132,.35); color: #a9ffd9; }
    .badge.warn { border-color: rgba(255,165,2,.45); color: #ffe0a6; }
    .badge.err { border-color: rgba(255,71,87,.45); color: #ffc0c6; }

    .grid { display: grid; grid-template-columns: 1.08fr .92fr; gap: 16px; }
    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 10px 35px rgba(0,0,0,.20);
      overflow: hidden;
    }
    .card-header {
      padding: 16px 16px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card-body { padding: 16px; display: grid; gap: 13px; }
    .field { display: grid; gap: 7px; }
    .label-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    label { color: #fff; font-weight: 750; font-size: .94rem; }
    .hint { color: var(--muted); font-size: .81rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .amount-wrap { display: grid; grid-template-columns: 1fr 76px; gap: 8px; align-items: center; }
    .currency-fixed {
      height: 100%; min-height: 48px; display: grid; place-items: center;
      border: 1px solid rgba(0,208,132,.30); border-radius: 14px;
      background: rgba(0,208,132,.08); color: #a9ffd9; font-weight: 900; user-select: none;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .actions.grid-actions { display: grid; grid-template-columns: 1fr 1fr; }
    .btn {
      border: 0; border-radius: 14px; min-height: 46px; padding: 11px 14px; cursor: pointer;
      font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--accent), #4a3cff);
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      transition: .18s transform, .18s opacity, .18s filter; text-align: center;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .52; cursor: not-allowed; filter: grayscale(.18); transform: none; }
    .btn-secondary { background: linear-gradient(135deg, #0ea5e9, #06b6d4); }
    .btn-good { background: linear-gradient(135deg, #16a34a, #00d084); }
    .btn-ghost { min-height: 42px; background: rgba(255,255,255,.08); border: 1px solid var(--border); color: var(--text); }

    .notice {
      border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.055);
      border-radius: 16px; padding: 12px 14px; color: var(--muted); font-size: .92rem;
    }
    .notice.ok { border-color: rgba(0,208,132,.30); color: #caffea; background: rgba(0,208,132,.07); }
    .notice.err { border-color: rgba(255,71,87,.32); color: #ffd0d5; background: rgba(255,71,87,.07); }
    .notice.warn { border-color: rgba(255,165,2,.33); color: #ffe5b5; background: rgba(255,165,2,.075); }
    .status-list { display: grid; gap: 9px; }
    .status-line {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border: 1px solid rgba(255,255,255,.09); background: rgba(255,255,255,.045);
      padding: 10px 12px; border-radius: 14px; overflow-wrap: anywhere;
    }
    .key { color: var(--muted); font-size: .88rem; flex: 0 0 auto; }
    .value { color: var(--text); font-weight: 750; text-align: left; direction: ltr; overflow-wrap: anywhere; }
    .readonly-view {
      background: rgba(255,255,255,.045);
      border-color: rgba(34,211,238,.18);
    }
    .footer { text-align: center; color: var(--muted); font-size: .88rem; }

    @media (max-width: 850px) {
      body { padding: 10px 10px calc(18px + var(--safe-bottom)); }
      .hero-inner { padding: 18px; }
      .grid, .row { grid-template-columns: 1fr; }
      .actions.grid-actions { grid-template-columns: 1fr; }
      .amount-wrap { grid-template-columns: 1fr 70px; }
    }
  </style>
</head>
<body>
  <noscript><div class="notice err">JavaScript غير مفعل. يجب تفعيل JavaScript حتى يعمل تطبيق Cortex Escrow.</div></noscript>

  <main class="app" id="appRoot">
    <section class="hero" aria-labelledby="pageTitle">
      <div class="hero-inner">
        <div class="brand-row">
          <div class="brand">
            <div class="logo" aria-hidden="true">Pi</div>
            <div>
              <h1 id="pageTitle">Cortex Escrow</h1>
              <p class="subtitle">Pi Testnet Escrow</p>
            </div>
          </div>
          <div class="badges" aria-label="حالة التطبيق">
            <span class="badge warn" id="networkBadge">TESTNET</span>
            <span class="badge" id="backendBadge">Backend</span>
            <span class="badge ok">Currency: Pi</span>
          </div>
        </div>
      </div>
    </section>

    <section class="grid" id="mainGrid" aria-label="لوحة إنشاء صفقة ضمان">
      <section class="card" aria-label="إنشاء صفقة ضمان">
        <div class="card-header">
          <div>
            <h2>إنشاء صفقة ضمان</h2>
          </div>
        </div>

        <div class="card-body">
          <div class="field">
            <div class="label-row">
              <label for="description">وصف الصفقة</label>
              <span class="hint">مطلوب</span>
            </div>
            <textarea id="description" name="description" maxlength="2000" autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="dealTerms">شروط الصفقة</label>
              <span class="hint">اختياري</span>
            </div>
            <textarea id="dealTerms" name="dealTerms" maxlength="2000" autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea>
          </div>

          <div class="row">
            <div class="field">
              <div class="label-row">
                <label for="dealType">نوع الصفقة</label>
              </div>
              <select id="dealType" name="dealType">
                <option value="service">خدمة</option>
                <option value="digital">منتج رقمي</option>
                <option value="physical">منتج مادي</option>
                <option value="other">أخرى</option>
              </select>
            </div>

            <div class="field">
              <div class="label-row">
                <label for="amount">السعر</label>
                <span class="hint">حتى 7 أرقام عشرية</span>
              </div>
              <div class="amount-wrap">
                <input id="amount" name="amount" inputmode="decimal" autocomplete="off" />
                <div class="currency-fixed" aria-label="العملة الثابتة">Pi</div>
              </div>
            </div>
          </div>

          <div class="actions grid-actions">
            <button type="button" class="btn" id="createBtn">إنشاء الصفقة</button>
            <button type="button" class="btn btn-good" id="payBtn" disabled>دفع Pi Testnet</button>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="publicDealUrl">رابط الصفقة</label>
            </div>
            <input id="publicDealUrl" readonly data-keep-readonly="true" class="readonly-view" />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="shareText">نص المشاركة</label>
            </div>
            <textarea id="shareText" readonly data-keep-readonly="true" class="readonly-view" style="min-height:90px"></textarea>
          </div>

          <div class="actions">
            <button type="button" class="btn btn-ghost" id="copyShareBtn" disabled>نسخ المشاركة</button>
            <button type="button" class="btn btn-ghost" id="nativeShareBtn" disabled>مشاركة</button>
          </div>
        </div>
      </section>

      <aside class="card" aria-label="حالة الصفقة">
        <div class="card-header">
          <div>
            <h2>حالة الصفقة</h2>
          </div>
          <button type="button" class="btn btn-ghost" id="healthBtn">فحص الباكند</button>
        </div>

        <div class="card-body">
          <div class="status-list">
            <div class="status-line"><span class="key">Backend</span><span class="value" id="backendUrlView"></span></div>
            <div class="status-line"><span class="key">Pi Account</span><span class="value" id="userView"></span></div>
            <div class="status-line"><span class="key">Deal ID</span><span class="value" id="dealView"></span></div>
            <div class="status-line"><span class="key">Amount</span><span class="value" id="amountView"></span></div>
            <div class="status-line"><span class="key">Payment ID</span><span class="value" id="paymentView"></span></div>
            <div class="status-line"><span class="key">TXID</span><span class="value" id="txView"></span></div>
            <div class="status-line"><span class="key">Status</span><span class="value" id="statusView"></span></div>
          </div>

          <div class="notice" id="resultBox"></div>

          <div class="actions">
            <button type="button" class="btn btn-ghost" id="refreshDealBtn" disabled>قراءة الصفقة</button>
          </div>
        </div>
      </aside>
    </section>

    <p class="footer">
      <a href="terms.html">Terms</a> ·
      <a href="privacy.html">Privacy</a> ·
      Cortex Escrow · Pi Testnet
    </p>
  </main>

  <script>
    'use strict';

    const CONFIG = Object.freeze({
      APP_NAME: 'Cortex Escrow',
      VERSION: '13.0.8.8-stage-1-clean',
      APP_ID: '24f0d30e-9254-4936-9425-751c825c4aea',
      NETWORK: 'PI_TESTNET',
      BACKEND_URL: 'https://pi-backend-kv9g.onrender.com',
      SDK_VERSION: '2.0',
      SANDBOX: true,
      CURRENCY: 'Pi',
      PI_DECIMALS: 7,
      MIN_AMOUNT: 0.0000001,
      MAX_AMOUNT: 100000,
      REQUEST_TIMEOUT_MS: 22000
    });

    const PI_AUTH_SCOPES = Object.freeze(['username']);

    const state = {
      piInitialized: false,
      auth: null,
      accessToken: null,
      piUser: null,
      username: '',
      currentDeal: null,
      dealId: null,
      paymentId: null,
      txid: null,
      backendOnline: false,
      paymentBusy: false
    };

    const $ = (id) => document.getElementById(id);
    const ui = {};

    function collectUi() {
      const ids = [
        'createBtn','payBtn','healthBtn','refreshDealBtn','copyShareBtn','nativeShareBtn',
        'backendBadge','networkBadge','backendUrlView','userView','dealView','amountView','paymentView','txView','statusView',
        'resultBox','description','dealTerms','amount','dealType','publicDealUrl','shareText'
      ];
      for (const id of ids) ui[id] = $(id);
      return ids.every((id) => Boolean(ui[id]));
    }

    function setResult(message, type = '') {
      ui.resultBox.textContent = message || '';
      ui.resultBox.className = type ? `notice ${type}` : 'notice';
    }

    function setBackendBadge(type, text) {
      ui.backendBadge.textContent = text || 'Backend';
      ui.backendBadge.className = type ? `badge ${type}` : 'badge';
    }

    function setBusy(button, busy) {
      if (!button) return;
      button.disabled = Boolean(busy);
    }

    function normalizeAmountText(value) {
      return String(value ?? '')
        .trim()
        .replace(',', '.')
        .replace(/[٠-٩]/g, function(digit) { return String('٠١٢٣٤٥٦٧٨٩'.indexOf(digit)); })
        .replace(/[۰-۹]/g, function(digit) { return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(digit)); });
    }

    function parseAmount(value) {
      const raw = normalizeAmountText(value);
      if (!raw) return null;
      if (!/^\d+(?:\.\d{1,7})?$/.test(raw)) return null;
      const number = Number(raw);
      if (!Number.isFinite(number)) return null;
      if (number < CONFIG.MIN_AMOUNT || number > CONFIG.MAX_AMOUNT) return null;
      return raw;
    }

    function installAmountGuard() {
      ui.amount.addEventListener('input', function() {
        const original = ui.amount.value;
        const normalized = normalizeAmountText(original);
        const cleaned = normalized.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');
        const parts = cleaned.split('.');
        let nextValue = parts[0] || '';
        if (parts.length > 1) nextValue += '.' + parts[1].slice(0, CONFIG.PI_DECIMALS);
        if (nextValue !== original) ui.amount.value = nextValue;
      });
    }

    function refreshView() {
      const deal = state.currentDeal;
      const dealId = state.dealId || deal?.dealId || deal?.contractId || '';
      const amount = deal?.amount ?? '';
      ui.networkBadge.textContent = CONFIG.NETWORK === 'PI_TESTNET' ? 'TESTNET' : CONFIG.NETWORK;
      ui.backendUrlView.textContent = CONFIG.BACKEND_URL;
      ui.userView.textContent = state.username ? 'تم الاتصال' : '';
      ui.dealView.textContent = dealId || '';
      ui.amountView.textContent = amount ? `${amount} ${CONFIG.CURRENCY}` : '';
      ui.paymentView.textContent = state.paymentId || deal?.paymentId || '';
      ui.txView.textContent = state.txid || deal?.txid || '';
      ui.statusView.textContent = deal?.status || '';
      ui.payBtn.disabled = !deal || state.paymentBusy;
      ui.refreshDealBtn.disabled = !deal;
      const canShare = Boolean(dealId);
      ui.copyShareBtn.disabled = !canShare;
      ui.nativeShareBtn.disabled = !canShare;
    }

    function extractAuthUser(auth) {
      if (!auth) return {};
      return auth.user || auth;
    }

    function extractUsername(auth) {
      const user = extractAuthUser(auth);
      return String(user.username || '').trim();
    }

    function ensurePiSdk() {
      if (!window.Pi) {
        setResult('Pi SDK غير متاح', 'warn');
        return false;
      }

      if (state.piInitialized) return true;

      if (typeof window.Pi.init !== 'function') {
        setResult('Pi SDK غير مكتمل', 'warn');
        return false;
      }

      window.Pi.init({
        version: CONFIG.SDK_VERSION,
        sandbox: CONFIG.SANDBOX
      });

      state.piInitialized = true;
      return true;
    }

    function startAutoPiAllow() {
      if (!ensurePiSdk()) {
        refreshView();
        return;
      }

      if (typeof window.Pi.authenticate !== 'function') {
        setResult('Pi authenticate غير متاح', 'warn');
        refreshView();
        return;
      }

      window.Pi.authenticate(PI_AUTH_SCOPES, onIncompletePaymentFound)
        .then(function(auth) {
          state.auth = auth;
          state.accessToken = auth?.accessToken || auth?.token || '';
          state.piUser = extractAuthUser(auth);
          state.username = extractUsername(auth);
          setResult('تم الاتصال', 'ok');
          refreshView();
        })
        .catch(function(error) {
          setResult(error && error.message ? error.message : 'تعذر الاتصال بحساب Pi', 'warn');
          refreshView();
        });

      refreshView();
    }

    async function fetchJson(path, options = {}) {
      const controller = new AbortController();
      const timeout = setTimeout(function() {
        controller.abort();
      }, CONFIG.REQUEST_TIMEOUT_MS);

      try {
        const response = await fetch(CONFIG.BACKEND_URL + path, {
          method: options.method || 'GET',
          headers: {
            'Content-Type': 'application/json',
            ...(options.headers || {})
          },
          body: options.body === undefined ? undefined : JSON.stringify(options.body),
          signal: controller.signal
        });

        const text = await response.text();
        let data = {};
        if (text) {
          try { data = JSON.parse(text); }
          catch (_) { data = { success: false, message: text }; }
        }

        if (!response.ok || data.success === false) {
          const error = new Error(data.message || `HTTP ${response.status}`);
          error.details = data;
          throw error;
        }

        return data;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function checkBackend() {
      try {
        const data = await fetchJson('/api/health');
        state.backendOnline = true;
        setBackendBadge('ok', 'Backend OK');
        if (!ui.resultBox.textContent) setResult(data.status || 'OK', 'ok');
      } catch (error) {
        state.backendOnline = false;
        setBackendBadge('err', 'Backend Error');
        setResult(error.message || 'Backend Error', 'err');
      }
      refreshView();
    }

    function getDealPayload() {
      const description = ui.description.value.trim();
      const terms = ui.dealTerms.value.trim();
      const amount = parseAmount(ui.amount.value);

      if (!description) {
        throw new Error('وصف الصفقة مطلوب');
      }

      if (amount === null) {
        throw new Error('السعر يجب أن يكون من 0.0000001 إلى 100000 Pi وبحد أقصى 7 أرقام عشرية');
      }

      const payload = {
        description,
        terms,
        dealType: ui.dealType.value,
        amount
      };

      if (state.username) payload.buyer = state.username;

      return payload;
    }

    function normalizeDealResult(result) {
      const deal = result.deal || {};
      const dealId = result.dealId || result.contractId || deal.dealId || deal.contractId || '';
      return {
        ...deal,
        dealId,
        contractId: deal.contractId || dealId,
        amount: result.amount ?? deal.amount,
        currency: result.currency || deal.currency || CONFIG.CURRENCY,
        network: result.network || deal.network || CONFIG.NETWORK,
        status: result.status || deal.status || 'CREATED',
        paymentId: result.paymentId || deal.paymentId || '',
        txid: result.txid || deal.txid || ''
      };
    }

    function updateShareData() {
      const deal = state.currentDeal;
      const dealId = state.dealId || deal?.dealId || deal?.contractId || '';
      if (!dealId) {
        ui.publicDealUrl.value = '';
        ui.shareText.value = '';
        return;
      }

      const url = `${location.origin}${location.pathname}?deal=${encodeURIComponent(dealId)}`;
      const amount = deal?.amount ? `${deal.amount} ${CONFIG.CURRENCY}` : CONFIG.CURRENCY;
      ui.publicDealUrl.value = url;
      ui.shareText.value = `Cortex Escrow\nDeal ID: ${dealId}\nAmount: ${amount}\n${url}`;
    }

    async function createDeal() {
      setBusy(ui.createBtn, true);
      setResult('');

      try {
        const result = await fetchJson('/api/escrow/create', {
          method: 'POST',
          body: getDealPayload()
        });

        state.currentDeal = normalizeDealResult(result);
        state.dealId = state.currentDeal.dealId || state.currentDeal.contractId;
        state.paymentId = state.currentDeal.paymentId || '';
        state.txid = state.currentDeal.txid || '';
        updateShareData();
        setResult(result.message || 'تم إنشاء الصفقة', 'ok');
      } catch (error) {
        setResult(error.message || 'فشل إنشاء الصفقة', 'err');
      } finally {
        setBusy(ui.createBtn, false);
        refreshView();
      }
    }

    async function readDeal() {
      const dealId = state.dealId || state.currentDeal?.dealId || state.currentDeal?.contractId;
      if (!dealId) return;

      setResult('');

      try {
        const result = await fetchJson(`/api/escrow/${encodeURIComponent(dealId)}`);
        state.currentDeal = result.deal || state.currentDeal;
        state.dealId = state.currentDeal.dealId || state.currentDeal.contractId || dealId;
        state.paymentId = state.currentDeal.paymentId || state.paymentId || '';
        state.txid = state.currentDeal.txid || state.txid || '';
        updateShareData();
        setResult('تم تحديث بيانات الصفقة', 'ok');
      } catch (error) {
        setResult(error.message || 'تعذر قراءة الصفقة', 'err');
      }

      refreshView();
    }

    function getPaymentId(payment) {
      return payment?.identifier || payment?.paymentId || payment?.id || '';
    }

    function getPaymentTxid(payment) {
      return payment?.transaction?.txid || payment?.txid || '';
    }

    function getPaymentDealId(payment) {
      return payment?.metadata?.dealId || state.dealId || state.currentDeal?.dealId || state.currentDeal?.contractId || '';
    }

    async function approvePayment(paymentId, dealId) {
      return fetchJson('/api/pi/approve', {
        method: 'POST',
        body: { paymentId, dealId, contractId: dealId }
      });
    }

    async function completePayment(paymentId, txid, dealId) {
      return fetchJson('/api/pi/complete', {
        method: 'POST',
        body: { paymentId, txid, dealId, contractId: dealId }
      });
    }

    async function cancelPayment(paymentId) {
      if (!paymentId) return null;
      return fetchJson('/api/pi/cancel', {
        method: 'POST',
        body: { paymentId }
      });
    }

    async function onIncompletePaymentFound(payment) {
      const paymentId = getPaymentId(payment);
      const txid = getPaymentTxid(payment);
      const dealId = getPaymentDealId(payment);

      if (!paymentId) return;

      state.paymentId = paymentId;
      if (txid) state.txid = txid;
      refreshView();

      if (!txid) {
        setResult('توجد دفعة Pi غير مكتملة', 'warn');
        return;
      }

      try {
        await completePayment(paymentId, txid, dealId);
        if (dealId) {
          state.dealId = dealId;
          state.currentDeal = {
            ...(state.currentDeal || {}),
            dealId,
            contractId: dealId,
            paymentId,
            txid,
            status: 'COMPLETED'
          };
        }
        updateShareData();
        setResult('تم إكمال دفعة سابقة', 'ok');
      } catch (error) {
        setResult(error.message || 'تعذر إكمال دفعة سابقة', 'warn');
      }

      refreshView();
    }

    function startPiPayment() {
      const dealId = state.dealId || state.currentDeal?.dealId || state.currentDeal?.contractId;
      const amount = Number(state.currentDeal?.amount);

      if (!dealId) {
        setResult('أنشئ الصفقة أولاً', 'warn');
        return;
      }

      if (!Number.isFinite(amount) || amount <= 0) {
        setResult('السعر غير صحيح', 'err');
        return;
      }

      if (!ensurePiSdk() || typeof window.Pi.createPayment !== 'function') {
        setResult('Pi Wallet غير متاح', 'err');
        return;
      }

      state.paymentBusy = true;
      refreshView();
      setResult('');

      try {
        const payment = window.Pi.createPayment({
          amount,
          memo: `Cortex Escrow ${dealId}`,
          metadata: { dealId }
        }, {
          onReadyForServerApproval: async function(paymentId) {
            state.paymentId = paymentId;
            refreshView();
            await approvePayment(paymentId, dealId);
          },
          onReadyForServerCompletion: async function(paymentId, txid) {
            state.paymentId = paymentId;
            state.txid = txid;
            refreshView();
            await completePayment(paymentId, txid, dealId);
            state.currentDeal = {
              ...(state.currentDeal || {}),
              dealId,
              contractId: dealId,
              paymentId,
              txid,
              status: 'COMPLETED'
            };
            updateShareData();
            setResult('تم الدفع بنجاح', 'ok');
            await readDeal().catch(function() {});
          },
          onCancel: async function(paymentId) {
            state.paymentId = paymentId || state.paymentId;
            try {
              await cancelPayment(paymentId);
            } catch (_) {}
            setResult('تم إلغاء الدفع', 'warn');
            refreshView();
          },
          onError: function(error, paymentData) {
            state.paymentId = getPaymentId(paymentData) || state.paymentId;
            state.txid = getPaymentTxid(paymentData) || state.txid;
            setResult(error && error.message ? error.message : 'تعذر تنفيذ الدفع', 'err');
            refreshView();
          }
        });

        if (payment && typeof payment.catch === 'function') {
          payment.catch(function(error) {
            setResult(error && error.message ? error.message : 'تعذر فتح Pi Wallet', 'err');
          }).finally(function() {
            state.paymentBusy = false;
            refreshView();
          });
        } else {
          state.paymentBusy = false;
          refreshView();
        }
      } catch (error) {
        state.paymentBusy = false;
        setResult(error && error.message ? error.message : 'تعذر فتح Pi Wallet', 'err');
        refreshView();
      }
    }

    async function copyShareText() {
      const text = ui.shareText.value || ui.publicDealUrl.value || '';
      if (!text) return;
      await navigator.clipboard.writeText(text);
      setResult('تم النسخ', 'ok');
    }

    async function nativeShare() {
      const title = CONFIG.APP_NAME;
      const text = ui.shareText.value || '';
      const url = ui.publicDealUrl.value || location.href;

      if (navigator.share) {
        await navigator.share({ title, text, url });
        setResult('تم فتح المشاركة', 'ok');
      } else {
        await navigator.clipboard.writeText(text || url);
        setResult('تم النسخ', 'ok');
      }
    }

    function bindEvents() {
      ui.createBtn.addEventListener('click', createDeal);
      ui.payBtn.addEventListener('click', startPiPayment);
      ui.healthBtn.addEventListener('click', checkBackend);
      ui.refreshDealBtn.addEventListener('click', readDeal);
      ui.copyShareBtn.addEventListener('click', copyShareText);
      ui.nativeShareBtn.addEventListener('click', function() {
        nativeShare().catch(function(error) {
          setResult(error && error.message ? error.message : 'تعذر فتح المشاركة', 'warn');
        });
      });
    }

    async function boot() {
      if (!collectUi()) return;
      ui.backendUrlView.textContent = CONFIG.BACKEND_URL;
      installAmountGuard();
      bindEvents();
      refreshView();
      checkBackend().catch(function() {});
      startAutoPiAllow();
    }

    document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
